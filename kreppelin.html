<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>NEURO KREPELIN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(circle at 15% 15%,#ff00cc55,transparent 28%),
    radial-gradient(circle at 85% 25%,#00eaff55,transparent 30%),
    radial-gradient(circle at 50% 100%,#7b2cff55,transparent 40%),
    #080018;
}

body.playing{
  animation:bgMove 5s linear infinite alternate;
}

@keyframes bgMove{
  0%{background-position:0 0}
  100%{background-position:100% 100%}
}

button{
  font-family:inherit;
  cursor:pointer;
}

.container{
  width:min(1100px,96%);
  margin:auto;
  padding:18px 0 35px;
}

/* TITLE */

.title{
  text-align:center;
  font-size:clamp(34px,7vw,70px);
  font-weight:1000;
  letter-spacing:3px;
  line-height:1;
  background:
    linear-gradient(
      90deg,
      #ff00cc,
      #ffe600,
      #00ffff,
      #7b5cff,
      #ff00cc
    );
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:rainbow 3s linear infinite;
  text-shadow:none;
}

@keyframes rainbow{
  to{
    background-position:300% center;
  }
}

.subtitle{
  text-align:center;
  margin-top:9px;
  font-size:14px;
  font-weight:900;
  letter-spacing:3px;
  opacity:.75;
}

/* TOP */

.top{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0 14px;
}

.time-btn{
  border:0;
  color:#fff;
  font-size:17px;
  font-weight:1000;
  padding:11px 24px;
  border-radius:17px;
  background:linear-gradient(135deg,#6d35ff,#00cfff);
  box-shadow:
    0 0 18px #00cfff66,
    inset 0 0 10px #ffffff22;
}

.time-btn.active{
  transform:scale(1.08);
  box-shadow:
    0 0 28px #fff8,
    0 0 50px #00cfff66;
}

.start-btn{
  border:0;
  color:#fff;
  font-size:18px;
  font-weight:1000;
  padding:12px 27px;
  border-radius:17px;
  background:linear-gradient(135deg,#ff008c,#ff8a00);
  box-shadow:
    0 0 25px #ff008c88,
    inset 0 0 10px #ffffff22;
}

.start-btn:active,
.time-btn:active{
  transform:scale(.96);
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-bottom:14px;
}

.stat{
  text-align:center;
  padding:8px 4px;
  border-radius:15px;
  background:#ffffff0e;
  border:1px solid #ffffff22;
  backdrop-filter:blur(8px);
}

.stat-label{
  font-size:10px;
  font-weight:900;
  opacity:.6;
  letter-spacing:1px;
}

.stat-value{
  margin-top:2px;
  font-size:23px;
  font-weight:1000;
}

/* GAME */

.game{
  position:relative;
  padding:18px;
  border-radius:28px;
  background:#00000035;
  border:1px solid #ffffff22;
  box-shadow:0 0 45px #0008;
  overflow:hidden;
}

.question-area{
  min-height:210px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.question-track{
  position:relative;
  width:100%;
  height:160px;
  overflow:hidden;
}

.question{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  white-space:nowrap;

  font-size:clamp(55px,12vw,110px);
  line-height:1;
  font-weight:1000;

  text-shadow:
    0 0 10px #fff,
    0 0 25px #00eaff,
    0 0 50px #7b2cff;
}

.question-slide-out{
  animation:questionOut .28s ease-in forwards;
}

.question-slide-in{
  animation:questionIn .28s ease-out forwards;
}

@keyframes questionOut{
  from{
    left:50%;
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }

  to{
    left:-50%;
    opacity:0;
    transform:translate(-50%,-50%) scale(.7);
  }
}

@keyframes questionIn{
  from{
    left:110%;
    opacity:0;
    transform:translate(-50%,-50%) scale(.7);
  }

  to{
    left:50%;
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* NEXT */

.next-preview{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  width:245px;
  text-align:center;
}

.next-label{
  margin-bottom:10px;
  font-size:14px;
  font-weight:1000;
  letter-spacing:4px;
  opacity:.65;
}

.next-numbers{
  display:flex;
  justify-content:center;
  gap:12px;
}

.next-number{
  width:92px;
  height:92px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:24px;
  border:2px solid #ffffff44;

  font-size:42px;
  font-weight:1000;

  background:
    linear-gradient(145deg,#00d9ff,#6935ff);

  box-shadow:
    0 0 20px #00d9ff66,
    inset 0 0 18px #ffffff22;
}

.next-number:nth-child(2){
  background:
    linear-gradient(145deg,#ff008c,#ff7900);

  box-shadow:
    0 0 20px #ff008c66,
    inset 0 0 18px #ffffff22;
}

/* MOBILE */

@media(max-width:760px){

  .question-area{
    min-height:280px;
    display:block;
  }

  .question-track{
    height:165px;
  }

  .next-preview{
    position:absolute;
    left:50%;
    right:auto;
    top:auto;
    bottom:5px;
    transform:translateX(-50%);
    width:230px;
  }

  .next-number{
    width:90px;
    height:70px;
    border-radius:20px;
    font-size:34px;
  }
}

/* KEYPAD */

.keypad{
  width:min(430px,100%);
  margin:20px auto 0;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.key{
  height:78px;

  border:0;
  border-radius:21px;

  color:#fff;
  font-size:31px;
  font-weight:1000;

  background:
    linear-gradient(145deg,#292348,#15112c);

  border:2px solid #ffffff22;

  box-shadow:
    0 7px 0 #07040f,
    0 0 17px #684cff44;

  transition:
    transform .07s,
    filter .07s,
    box-shadow .07s;
}

.key:nth-child(3n+1){
  box-shadow:
    0 7px 0 #07040f,
    0 0 20px #ff00cc55;
}

.key:nth-child(3n+2){
  box-shadow:
    0 7px 0 #07040f,
    0 0 20px #00eaff55;
}

.key:nth-child(3n){
  box-shadow:
    0 7px 0 #07040f,
    0 0 20px #7bff0055;
}

.key.zero{
  grid-column:2;
}

.key:active{
  transform:translateY(7px) scale(.96);
  box-shadow:0 1px 0 #07040f;
}

/* ANSWER EFFECT */

.correct{
  animation:correctFlash .28s ease;
}

@keyframes correctFlash{
  50%{
    transform:scale(1.06);
    filter:brightness(1.8);
  }
}

.miss{
  animation:missShake .3s ease;
}

@keyframes missShake{
  20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}
  60%{transform:translateX(-7px)}
  80%{transform:translateX(5px)}
}

/* COMBO */

.combo-pop{
  position:fixed;
  left:50%;
  top:35%;

  transform:translate(-50%,-50%) scale(.3);

  z-index:1000;
  pointer-events:none;

  font-size:clamp(42px,10vw,100px);
  font-weight:1000;
  white-space:nowrap;

  text-shadow:
    0 0 15px #fff,
    0 0 35px #00eaff,
    0 0 60px #ff00cc;

  animation:comboPop .8s ease-out forwards;
}

@keyframes comboPop{

  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3) rotate(-8deg);
  }

  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.2) rotate(4deg);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-75%) scale(1.5);
  }
}

/* FEVER */

.fever{
  position:fixed;
  inset:0;
  z-index:900;

  display:none;
  pointer-events:none;

  overflow:hidden;
}

.fever.active{
  display:block;
}

.fever-ring{
  position:absolute;

  left:50%;
  top:50%;

  width:190px;
  height:190px;

  border-radius:50%;

  transform:translate(-50%,-50%);

  border:18px solid transparent;
  border-top-color:#ff00cc;
  border-right-color:#00ffff;
  border-bottom-color:#ffe600;
  border-left-color:#7b2cff;

  animation:spin .45s linear infinite;
}

@keyframes spin{
  to{
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

.fever-text{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  font-size:clamp(34px,8vw,82px);
  font-weight:1000;

  text-align:center;
  white-space:nowrap;

  text-shadow:
    0 0 20px #fff,
    0 0 50px #00eaff,
    0 0 80px #ff00cc;

  animation:feverText .35s infinite alternate;
}

@keyframes feverText{
  from{
    transform:translate(-50%,-50%) scale(.9);
  }

  to{
    transform:translate(-50%,-50%) scale(1.1);
  }
}

.fever-particle{
  position:absolute;

  width:12px;
  height:12px;

  border-radius:50%;

  animation:particleFly 1s ease-out forwards;
}

@keyframes particleFly{
  from{
    opacity:1;
    transform:translate(0,0) scale(1);
  }

  to{
    opacity:0;
    transform:
      translate(
        var(--x),
        var(--y)
      )
      scale(0);
  }
}

/* RESULT */

.result-overlay{
  position:fixed;
  inset:0;

  z-index:2000;

  display:none;
  align-items:center;
  justify-content:center;

  background:#05000dcc;
  backdrop-filter:blur(8px);
}

.result-overlay.show{
  display:flex;
}

.result-card{
  width:min(650px,92%);

  padding:35px 22px;

  text-align:center;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      #15102eF5,
      #09051aF5
    );

  border:2px solid #ffffff22;

  box-shadow:
    0 0 50px #7b2cff66,
    inset 0 0 30px #ffffff08;
}

.result-title{
  font-size:clamp(32px,8vw,65px);
  font-weight:1000;
  margin-bottom:22px;

  background:
    linear-gradient(
      90deg,
      #ff00cc,
      #ffe600,
      #00ffff,
      #7b5cff
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.result-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.result-stat{
  padding:15px 5px;
  border-radius:18px;
  background:#ffffff0e;
  border:1px solid #ffffff18;
}

.result-stat-label{
  font-size:11px;
  opacity:.6;
  font-weight:900;
}

.result-stat-value{
  font-size:30px;
  font-weight:1000;
}

.restart-button{
  margin-top:24px;

  border:0;

  padding:14px 32px;

  border-radius:18px;

  color:#fff;

  font-size:18px;
  font-weight:1000;

  background:
    linear-gradient(
      135deg,
      #00cfff,
      #7b2cff
    );

  box-shadow:
    0 0 25px #00cfff66;
}

/* RESULT BOOM */

.result-boom{
  animation:
    resultZoom .55s ease-out,
    resultShake .6s ease-in-out;
}

@keyframes resultZoom{
  0%{
    transform:scale(.5);
    opacity:0;
  }

  45%{
    transform:scale(1.08);
    opacity:1;
  }

  100%{
    transform:scale(1);
  }
}

@keyframes resultShake{
  0%,100%{
    margin-left:0;
  }

  20%{
    margin-left:-14px;
  }

  40%{
    margin-left:14px;
  }

  60%{
    margin-left:-9px;
  }

  80%{
    margin-left:7px;
  }
}

/* RESULT PARTICLES */

.result-particle{
  position:fixed;

  left:50%;
  top:50%;

  width:13px;
  height:13px;

  border-radius:50%;

  z-index:2100;
  pointer-events:none;

  animation:
    resultParticle 1.5s ease-out forwards;
}

@keyframes resultParticle{

  from{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

  to{
    opacity:0;

    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(0);
  }
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="container">

  <div class="title">
    NEURO KREPELIN
  </div>

  <div class="subtitle">
    反射 × 計算 × コンボ
  </div>

  <div class="top">

    <button
      class="time-btn active"
      id="time30"
      onclick="selectTime(30)"
    >
      30 SEC
    </button>

    <button
      class="time-btn"
      id="time60"
      onclick="selectTime(60)"
    >
      60 SEC
    </button>

    <button
      class="start-btn"
      id="startButton"
      onclick="startGame()"
    >
      START GAME
    </button>

  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">30</div>
    </div>

    <div class="stat">
      <div class="stat-label">正解</div>
      <div class="stat-value" id="correct">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">ミス</div>
      <div class="stat-value" id="miss">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">COMBO</div>
      <div class="stat-value" id="combo">0</div>
    </div>

  </div>

  <div class="game">

    <div class="question-area">

      <div class="question-track" id="questionTrack">

        <div
          class="question"
          id="question"
        >
          READY?
        </div>

      </div>

      <div class="next-preview">

        <div class="next-label">
          NEXT
        </div>

        <div class="next-numbers">

          <div
            class="next-number"
            id="nextNumber1"
          >
            -
          </div>

          <div
            class="next-number"
            id="nextNumber2"
          >
            -
          </div>

        </div>

      </div>

    </div>

    <!-- 電話キー -->

    <div class="keypad">

      <button class="key" onclick="pressKey(1)">1</button>
      <button class="key" onclick="pressKey(2)">2</button>
      <button class="key" onclick="pressKey(3)">3</button>

      <button class="key" onclick="pressKey(4)">4</button>
      <button class="key" onclick="pressKey(5)">5</button>
      <button class="key" onclick="pressKey(6)">6</button>

      <button class="key" onclick="pressKey(7)">7</button>
      <button class="key" onclick="pressKey(8)">8</button>
      <button class="key" onclick="pressKey(9)">9</button>

      <button
        class="key zero"
        onclick="pressKey(0)"
      >
        0
      </button>

    </div>

  </div>

</div>


<!-- FEVER -->

<div
  class="fever"
  id="fever"
>

  <div class="fever-ring"></div>

  <div
    class="fever-text"
    id="feverText"
  >
    FEVER!!
  </div>

</div>


<!-- RESULT -->

<div
  class="result-overlay"
  id="resultOverlay"
>

  <div
    class="result-card"
    id="resultCard"
  >

    <div
      class="result-title"
      id="resultTitle"
    >
      RESULT
    </div>

    <div class="result-stats">

      <div class="result-stat">
        <div class="result-stat-label">
          正解
        </div>

        <div
          class="result-stat-value"
          id="resultCorrect"
        >
          0
        </div>
      </div>

      <div class="result-stat">
        <div class="result-stat-label">
          ミス
        </div>

        <div
          class="result-stat-value"
          id="resultMiss"
        >
          0
        </div>
      </div>

      <div class="result-stat">
        <div class="result-stat-label">
          BEST COMBO
        </div>

        <div
          class="result-stat-value"
          id="resultBest"
        >
          0
        </div>
      </div>

    </div>

    <button
      class="restart-button"
      id="restartButton"
      onclick="startGame()"
    >
      🔄 やり直す
    </button>

  </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let selectedTime = 30;

let timeLeft = 30;

let timer = null;

let playing = false;

let correctCount = 0;
let missCount = 0;
let combo = 0;
let bestCombo = 0;

let currentA = 2;
let currentB = 2;
let currentAnswer = 0;

let nextNumbers = [];

let feverRunning = false;


/* =========================
   ELEMENTS
========================= */

const timeEl =
  document.getElementById("time");

const correctEl =
  document.getElementById("correct");

const missEl =
  document.getElementById("miss");

const bestEl =
  document.getElementById("best");

const comboEl =
  document.getElementById("combo");

const questionEl =
  document.getElementById("question");

const questionTrack =
  document.getElementById("questionTrack");

const nextNumber1 =
  document.getElementById("nextNumber1");

const nextNumber2 =
  document.getElementById("nextNumber2");

const startButton =
  document.getElementById("startButton");

const fever =
  document.getElementById("fever");

const feverText =
  document.getElementById("feverText");

const resultOverlay =
  document.getElementById("resultOverlay");

const resultCard =
  document.getElementById("resultCard");

const resultTitle =
  document.getElementById("resultTitle");

const resultCorrect =
  document.getElementById("resultCorrect");

const resultMiss =
  document.getElementById("resultMiss");

const resultBest =
  document.getElementById("resultBest");


/* =========================
   BEST
========================= */

bestCombo =
  Number(localStorage.getItem("neuroKreppelinBest") || 0);

bestEl.textContent = bestCombo;


/* =========================
   TIME
========================= */

function selectTime(seconds){

  if(playing) return;

  selectedTime = seconds;

  time30.classList.toggle(
    "active",
    seconds === 30
  );

  time60.classList.toggle(
    "active",
    seconds === 60
  );

  timeEl.textContent = seconds;
}


/* =========================
   RANDOM
========================= */

function randomAddend(){

  /*
    1は絶対に出さない
    2〜9
  */

  return Math.floor(
    Math.random() * 8
  ) + 2;
}


/* =========================
   CREATE QUESTION
========================= */

function createFirstQuestion(){

  currentA = randomAddend();
  currentB = randomAddend();

  currentAnswer =
    (currentA + currentB) % 10;

  questionEl.textContent =
    `${currentA} + ${currentB}`;

  /*
    NEXTは
    次の問題のB
    さらにその次のB
  */

  const b1 = randomAddend();
  const b2 = randomAddend();

  nextNumbers = [b1,b2];

  updateNext();
}


/* =========================
   NEXT DISPLAY
========================= */

function updateNext(){

  nextNumber1.textContent =
    nextNumbers[0] ?? "-";

  nextNumber2.textContent =
    nextNumbers[1] ?? "-";
}


/* =========================
   NEXT QUESTION
========================= */

function advanceQuestion(){

  /*
    現在
      A + B

    次
      B + NEXT1

    さらに
      NEXT1 + NEXT2
  */

  const newA = currentB;

  const newB =
    nextNumbers[0];

  const followingB =
    randomAddend();

  currentA = newA;
  currentB = newB;

  currentAnswer =
    (currentA + currentB) % 10;

  nextNumbers.shift();

  nextNumbers.push(followingB);

  updateNext();


  /*
    問題を左へ流す
  */

  questionEl.classList.remove(
    "question-slide-out",
    "question-slide-in"
  );

  void questionEl.offsetWidth;

  questionEl.classList.add(
    "question-slide-out"
  );


  setTimeout(() => {

    questionEl.textContent =
      `${currentA} + ${currentB}`;

    questionEl.classList.remove(
      "question-slide-out"
    );

    questionEl.style.left = "110%";
    questionEl.style.opacity = "0";
    questionEl.style.transform =
      "translate(-50%,-50%) scale(.7)";

    void questionEl.offsetWidth;

    questionEl.style.left = "";
    questionEl.style.opacity = "";
    questionEl.style.transform = "";

    questionEl.classList.add(
      "question-slide-in"
    );

  },280);
}


/* =========================
   AUDIO ENGINE
========================= */

let audioContext = null;

function initAudio(){

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(AudioCtx){
      audioContext = new AudioCtx();
    }
  }

  if(
    audioContext &&
    audioContext.state === "suspended"
  ){
    audioContext.resume();
  }
}


function playTone(
  frequency,
  duration = .08,
  type = "sine",
  volume = .05,
  delay = 0
){

  if(!audioContext) return;

  const start =
    audioContext.currentTime + delay;

  const osc =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  osc.type = type;

  osc.frequency.setValueAtTime(
    frequency,
    start
  );

  gain.gain.setValueAtTime(
    0.0001,
    start
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    start + .008
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start(start);
  osc.stop(start + duration + .02);
}

function soundCorrect(){

  playTone(

    .07,

    .055

  playTone(

}

/* 節目 */

function soundMilestone(level){

  const base =
    level >= 100
      ? 880
      : level >= 80
        ? 760
        : level >= 50
          ? 650
          : 560;

  playTone(
    base,
    .12,
    "triangle",
    .075
  );

  playTone(
    base * 1.25,
    .12,
    "triangle",
    .07,
    .10
  );

  playTone(
    base * 1.5,
    .22,
    "triangle",
    .075,
    .20
  );

}


/* =========================
   START
========================= */

function startGame(){

  initAudio();

  clearInterval(timer);

  stopFever();

  resultOverlay.classList.remove("show");

  playing = true;

  document.body.classList.add("playing");

  selectedTime =
    selectedTime === 60
      ? 60
      : 30;

  timeLeft = selectedTime;

  correctCount = 0;
  missCount = 0;
  combo = 0;

  correctEl.textContent = "0";
  missEl.textContent = "0";
  comboEl.textContent = "0";
  timeEl.textContent = timeLeft;

  startButton.textContent =
    "PLAY AGAIN";

  document.getElementById("time30")
    .classList.toggle(
      "active",
      selectedTime === 30
    );

  document.getElementById("time60")
    .classList.toggle(
      "active",
      selectedTime === 60
    );

  createFirstQuestion();

  timer =
    setInterval(() => {

      timeLeft--;

      timeEl.textContent =
        timeLeft;

      if(timeLeft <= 0){

        endGame();

      }

    },1000);
}


/* =========================
   INPUT
========================= */

function pressKey(value){

  if(!playing) return;

  initAudio();

  if(value === currentAnswer){

    correctCount++;
    combo++;

    if(combo > bestCombo){

      bestCombo = combo;

      localStorage.setItem(
        "neuroKreppelinBest",
        bestCombo
      );

    }

    correctEl.textContent =
      correctCount;

    comboEl.textContent =
      combo;

    bestEl.textContent =
      bestCombo;

    soundCorrect();

    correctEl.classList.remove("correct");

    void correctEl.offsetWidth;

    correctEl.classList.add("correct");


    /*
      正解数で節目演出
    */

    if(
      correctCount === 30 ||
      correctCount === 50 ||
      correctCount === 80 ||
      correctCount === 100
    ){

      milestone(correctCount);

    }
    else if(
      combo >= 5 &&
      combo % 5 === 0
    ){

      comboEffect(combo);

    }

    advanceQuestion();

  }
  else{

    missCount++;

    combo = 0;

    missEl.textContent =
      missCount;

    comboEl.textContent =
      combo;

    soundMiss();

    missEl.classList.remove("miss");

    void missEl.offsetWidth;

    missEl.classList.add("miss");
  }
}


/* =========================
   COMBO EFFECT
========================= */

function comboEffect(number){

  const pop =
    document.createElement("div");

  pop.className =
    "combo-pop";

  pop.textContent =
    `${number} COMBO!`;

  document.body.appendChild(pop);

  soundCombo();

  setTimeout(() => {
    pop.remove();
  },850);
}


/* =========================
   MILESTONE
========================= */

function milestone(number){

  let duration = 5000;

  if(number === 30){
    duration = 2000;
  }

  if(number === 50){
    duration = 5000;
  }

  if(number === 80){
    duration = 5000;
  }

  if(number === 100){
    duration = 5000;
  }

  let message =
    `${number} CORRECT!`;

  if(number === 30){
    message = "🔥 30 CORRECT! 🔥";
  }

  if(number === 50){
    message = "⚡ 50 CORRECT!! ⚡";
  }

  if(number === 80){
    message = "💥 80 CORRECT!!! 💥";
  }

  if(number === 100){
    message = "🌈 100 CORRECT!!! 🌈";
  }

  feverText.textContent =
    message;

  soundMilestone(number);

  showFever(duration);
}


/* =========================
   FEVER
========================= */

function showFever(duration){

  if(feverRunning){
    stopFever();
  }

  feverRunning = true;

  fever.classList.add("active");

  createFeverParticles();

  if(navigator.vibrate){

    try{
      navigator.vibrate(
        duration >= 5000
          ? [80,50,80,50,120]
          : [60,40,80]
      );
    }catch(e){}
  }

  setTimeout(() => {

    stopFever();

  },duration);
}


function stopFever(){

  feverRunning = false;

  fever.classList.remove("active");

  document
    .querySelectorAll(".fever-particle")
    .forEach(el => el.remove());
}


function createFeverParticles(){

  const count = 45;

  for(let i=0;i<count;i++){

    const p =
      document.createElement("div");

    p.className =
      "fever-particle";

    p.style.left =
      "50%";

    p.style.top =
      "50%";

    const angle =
      Math.random() * Math.PI * 2;

    const distance =
      100 + Math.random() * 500;

    p.style.setProperty(
      "--x",
      `${Math.cos(angle)*distance}px`
    );

    p.style.setProperty(
      "--y",
      `${Math.sin(angle)*distance}px`
    );

    const colors = [
      "#ff00cc",
      "#00ffff",
      "#ffe600",
      "#7b5cff",
      "#ff7b00",
      "#00ff88"
    ];

    p.style.background =
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];

    document
      .getElementById("fever")
      .appendChild(p);

    setTimeout(() => {
      p.remove();
    },1200);
  }
}


/* =========================
   END
========================= */

function endGame(){

  if(!playing) return;

  playing = false;

  clearInterval(timer);

  timer = null;

  stopFever();

  document.body.classList.remove("playing");

  timeLeft = 0;

  timeEl.textContent = "0";


  /*
    結果タイトル
  */

  let title = "RESULT";

  if(bestCombo >= 20){
    title = "🔥 LEGENDARY!!! 🔥";
  }
  else if(bestCombo >= 15){
    title = "⚡ AMAZING!! ⚡";
  }
  else if(correctCount >= 30){
    title = "🌈 GREAT!! 🌈";
  }
  else if(
    correctCount >= 20 &&
    missCount <= 5
  ){
    title = "✨ NICE PLAY! ✨";
  }
  else if(missCount <= 3){
    title = "🎯 ACCURATE!";
  }


  resultTitle.textContent =
    title;

  resultCorrect.textContent =
    correctCount;

  resultMiss.textContent =
    missCount;

  resultBest.textContent =
    bestCombo;


  resultOverlay.classList.add("show");

  resultCard.classList.remove(
    "result-boom"
  );

  void resultCard.offsetWidth;

  resultCard.classList.add(
    "result-boom"
  );


  soundResult();

  createResultParticles();


  /*
    結果演出は3秒で停止
  */

  setTimeout(() => {

    resultCard.classList.remove(
      "result-boom"
    );

    document
      .querySelectorAll(".result-particle")
      .forEach(el => el.remove());

  },3000);
}

/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key >= "0" &&
      e.key <= "9"
    ){

      pressKey(
        Number(e.key)
      );

    }

  }
);

   INITIAL
========================= */

selectTime(30);
