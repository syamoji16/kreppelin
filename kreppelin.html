<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEURO KREPELIN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 15%,#4c147d,transparent 32%),
    radial-gradient(circle at 85% 25%,#004b75,transparent 35%),
    radial-gradient(circle at 50% 100%,#66104f,transparent 40%),
    linear-gradient(135deg,#04000d,#090026,#00152d);
  background-size:180% 180%;
  animation:bgMove 10s ease-in-out infinite alternate;
}

body.theme-rainbow{
  background:
    linear-gradient(
      125deg,
      #ff006e,
      #6a00ff,
      #00b7ff,
      #00ff9d,
      #ffe600,
      #ff006e
    );
  background-size:400% 400%;
  animation:rainbowBg 7s linear infinite;
}

body.theme-cosmic{
  background:
    radial-gradient(circle at 20% 20%,#5420b8,transparent 28%),
    radial-gradient(circle at 80% 30%,#006d9c,transparent 30%),
    radial-gradient(circle at 50% 80%,#150060,transparent 35%),
    #02020c;
}

body.theme-fire{
  background:
    radial-gradient(circle at 50% 100%,#ff2600,transparent 40%),
    radial-gradient(circle at 20% 70%,#ff7b00,transparent 30%),
    linear-gradient(#180000,#060000);
}

@keyframes bgMove{
  from{background-position:0 0}
  to{background-position:100% 100%}
}

@keyframes rainbowBg{
  to{background-position:400% 0}
}

button{
  font:inherit;
  color:#fff;
  border:0;
}

.hidden{
  display:none!important;
}

.app{
  width:min(760px,100%);
  margin:auto;
  padding:14px 13px 40px;
}

.title{
  text-align:center;
  font-size:clamp(32px,9vw,62px);
  line-height:1;
  font-weight:1000;
  letter-spacing:2px;
  margin:8px 0 6px;
  color:transparent;
  background:
    linear-gradient(
      90deg,
      #ff28b8,
      #754cff,
      #00ddff,
      #32ff91,
      #ffe500,
      #ff28b8
    );
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  animation:titleMove 3s linear infinite;
  filter:
    drop-shadow(0 0 7px #ff28b8)
    drop-shadow(0 0 15px #00ddff);
}

@keyframes titleMove{
  to{background-position:300% center}
}

.subtitle{
  text-align:center;
  font-size:12px;
  font-weight:900;
  letter-spacing:3px;
  opacity:.8;
  margin-bottom:13px;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.timeBox{
  display:flex;
  gap:7px;
}

.timeBtn,
.shopBtn{
  min-height:50px;
  border-radius:16px;
  font-weight:1000;
  background:linear-gradient(135deg,#211c54,#151326);
  border:2px solid #6258ff;
  box-shadow:0 0 12px rgba(101,83,255,.55);
}

.timeBtn{
  flex:1;
  font-size:15px;
}

.timeBtn.active{
  background:linear-gradient(135deg,#ff27b8,#643cff);
  border-color:#fff;
  box-shadow:0 0 12px #ff35c0,0 0 25px #693cff;
}

.shopBtn{
  background:linear-gradient(135deg,#ff9d00,#ff2d72);
  border-color:#ffd86b;
}

.points{
  text-align:center;
  margin-top:8px;
  font-weight:1000;
  font-size:15px;
  color:#ffe66b;
  text-shadow:0 0 10px #ffb000;
}

/* START */

.startButton{
  width:100%;
  margin:12px 0 14px;
  min-height:82px;
  border-radius:25px;
  font-size:clamp(26px,7vw,40px);
  font-weight:1000;
  letter-spacing:2px;
  background:
    linear-gradient(
      90deg,
      #ff239f,
      #7144ff,
      #00cfff,
      #27f28a,
      #ffdb00,
      #ff239f
    );
  background-size:300% auto;
  animation:startRainbow 3s linear infinite;
  box-shadow:
    0 0 12px #ff32b6,
    0 0 28px #6945ff,
    0 0 50px rgba(0,220,255,.4);
  border:3px solid #fff;
  text-shadow:0 2px 5px #000;
  transition:.12s;
}

.startButton:active{
  transform:scale(.96);
}

@keyframes startRainbow{
  to{background-position:300% center}
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:9px;
}

.stat{
  background:rgba(10,5,30,.7);
  border:1px solid rgba(255,255,255,.22);
  border-radius:13px;
  padding:8px 3px;
  text-align:center;
}

.stat small{
  display:block;
  font-size:9px;
  opacity:.65;
  font-weight:900;
}

.stat b{
  font-size:19px;
}

/* TIMER */

.timer{
  height:9px;
  border-radius:20px;
  background:#100c25;
  overflow:hidden;
  margin-bottom:12px;
}

.timerBar{
  height:100%;
  width:100%;
  transform-origin:left;
  background:linear-gradient(90deg,#00ff9d,#00d9ff,#784cff,#ff2eae);
  box-shadow:0 0 10px #00ddff;
}

/* GAME */

.gameCard{
  position:relative;
  min-height:340px;
  padding:16px 10px 18px;
  border-radius:28px;
  background:rgba(5,3,20,.72);
  border:2px solid rgba(255,255,255,.15);
  box-shadow:
    0 0 20px rgba(88,66,255,.25),
    inset 0 0 30px rgba(255,255,255,.025);
}

.scoreLine{
  display:flex;
  justify-content:space-between;
  font-weight:1000;
  padding:0 6px;
  margin-bottom:9px;
}

#score{
  color:#6affd1;
  text-shadow:0 0 10px #00ffb3;
}

#combo{
  color:#ffe75c;
  text-shadow:0 0 10px #ffb700;
}

.questionArea{
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:clamp(54px,17vw,105px);
  font-weight:1000;
  text-shadow:
    0 0 8px #fff,
    0 0 20px #8c65ff;
  position:relative;
}

.qpart{
  display:inline-block;
  min-width:55px;
  text-align:center;
}

#qOperator{
  display:inline-block;
  min-width:35px;
}

.joinIn{
  animation:joinIn .23s cubic-bezier(.2,1.5,.3,1);
}

@keyframes joinIn{
  from{
    transform:translateX(70px) scale(1.2);
    opacity:0;
  }
  to{
    transform:translateX(0) scale(1);
    opacity:1;
  }
}

/* NEXT */

.nextArea{
  margin:2px auto 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.nextLabel{
  font-size:11px;
  font-weight:1000;
  letter-spacing:4px;
  opacity:.65;
  margin-bottom:5px;
}

.nextBoxes{
  display:flex;
  gap:10px;
}

.nextNumber{
  width:78px;
  height:65px;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:1000;
  background:linear-gradient(135deg,#1f145d,#30208b);
  border:2px solid #8273ff;
  box-shadow:0 0 14px #5f4bff;
}

.nextNumber.slide{
  animation:nextSlide .22s ease-out;
}

@keyframes nextSlide{
  from{
    transform:translateX(25px) scale(.8);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

/* KEYPAD */

.keypad{
  width:min(390px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.key{
  min-height:70px;
  border-radius:21px;
  font-size:30px;
  font-weight:1000;
  background:linear-gradient(145deg,#2b246a,#15112f);
  border:2px solid #655aff;
  box-shadow:
    0 0 10px rgba(95,75,255,.55),
    inset 0 0 9px rgba(255,255,255,.06);
  transition:.1s;
}

.key:nth-child(1){border-color:#ff4bb8}
.key:nth-child(2){border-color:#ff6b71}
.key:nth-child(3){border-color:#ffb13b}
.key:nth-child(4){border-color:#ffe247}
.key:nth-child(5){border-color:#6dff72}
.key:nth-child(6){border-color:#35e8ff}
.key:nth-child(7){border-color:#4c9dff}
.key:nth-child(8){border-color:#906dff}
.key:nth-child(9){border-color:#d05bff}
.key:nth-child(10){
  grid-column:2;
  border-color:#ff54db;
}

.key:active{
  transform:scale(.91);
  filter:brightness(1.5);
}

body.neon-strong .gameCard,
body.neon-strong .key,
body.neon-strong .nextNumber{
  box-shadow:
    0 0 15px currentColor,
    0 0 35px rgba(100,80,255,.7);
}

body.rainbow-buttons .key{
  background:
    linear-gradient(
      90deg,
      #ff247f,
      #703cff,
      #00d9ff,
      #2aff90,
      #ffe600
    );
  background-size:250% 100%;
  animation:rainbowBg 2.5s linear infinite;
}

body.fire-buttons .key{
  background:linear-gradient(145deg,#ff4100,#8e0c00,#290000);
  border-color:#ff9b00;
  box-shadow:0 0 15px #ff4800,0 0 30px #ff9000;
}

/* HIT */

.hit{
  animation:hitFlash .1s ease-out;
}

@keyframes hitFlash{
  0%{filter:brightness(1)}
  50%{filter:brightness(1.5)}
  100%{filter:brightness(1)}
}

/* FEVER */

#feverOverlay{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.04);
}

#feverOverlay.show{
  display:flex;
  animation:feverScreen .25s infinite alternate;
}

.feverText{
  font-size:clamp(42px,12vw,95px);
  font-weight:1000;
  text-align:center;
  color:#fff;
  text-shadow:
    0 0 8px #fff,
    0 0 20px #ff29b8,
    0 0 40px #00d9ff;
  animation:feverPop .35s infinite alternate;
}

@keyframes feverScreen{
  from{background:rgba(255,0,140,.03)}
  to{background:rgba(0,220,255,.16)}
}

@keyframes feverPop{
  from{transform:scale(.96) rotate(-1deg)}
  to{transform:scale(1.05) rotate(1deg)}
}

/* PARTICLES */

.particle{
  position:fixed;
  pointer-events:none;
  width:8px;
  height:8px;
  border-radius:50%;
  z-index:60;
  animation:particleFly 1s ease-out forwards;
}

@keyframes particleFly{
  from{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* OVERLAYS */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(3,0,15,.91);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal{
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:27px;
  background:linear-gradient(145deg,#130d35,#08051b);
  border:2px solid #715cff;
  box-shadow:
    0 0 25px #543dff,
    0 0 60px rgba(255,30,180,.2);
  padding:20px;
}

.modalTitle{
  text-align:center;
  font-size:29px;
  font-weight:1000;
  margin-bottom:5px;
}

.modalSub{
  text-align:center;
  opacity:.65;
  font-size:12px;
  margin-bottom:16px;
}

.resultStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.resultBox{
  border-radius:15px;
  padding:12px;
  background:#171033;
  border:1px solid #44377f;
  text-align:center;
}

.resultBox small{
  display:block;
  opacity:.6;
}

.resultBox b{
  font-size:25px;
}

.modalButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}

.modalButton{
  min-height:55px;
  border-radius:17px;
  background:linear-gradient(135deg,#6544ff,#b52cff);
  font-weight:1000;
  border:2px solid #9d8cff;
}

.modalButton.alt{
  background:linear-gradient(135deg,#272054,#15132c);
}

/* SHOP */

.shopBalance{
  text-align:center;
  color:#ffe45d;
  font-weight:1000;
  margin-bottom:12px;
}

.shopGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.shopItem{
  padding:13px 10px;
  border-radius:17px;
  background:linear-gradient(145deg,#1d163f,#0e0a23);
  border:1px solid #493c83;
}

.shopItem.owned{
  border-color:#36ffbd;
  box-shadow:0 0 13px rgba(0,255,180,.25);
}

.shopName{
  font-weight:1000;
  font-size:15px;
}

.shopDesc{
  font-size:10px;
  opacity:.65;
  min-height:31px;
  margin:5px 0 8px;
}

.shopBuy{
  width:100%;
  min-height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,#593aff,#d52cff);
  font-weight:1000;
}

.shopBuy:disabled{
  opacity:.4;
}

.closeBtn{
  width:100%;
  margin-top:12px;
  min-height:47px;
  border-radius:14px;
  background:#211a43;
  border:1px solid #56498b;
  font-weight:1000;
}

/* CUSTOMIZER */

.customSection{
  margin-bottom:15px;
}

.customSection h3{
  font-size:14px;
  margin:0 0 7px;
}

.choiceGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.choice{
  min-height:47px;
  border-radius:13px;
  background:#17112f;
  border:1px solid #493d76;
  font-size:12px;
  font-weight:900;
  padding:5px;
}

.choice.selected{
  border:2px solid #fff;
  background:linear-gradient(135deg,#633cff,#e62bb4);
  box-shadow:0 0 12px #874bff;
}

.choice.locked{
  opacity:.35;
}

.sampleBtn{
  width:100%;
  min-height:53px;
  border-radius:16px;
  background:linear-gradient(135deg,#ff9c00,#ff2789);
  font-weight:1000;
  margin-top:5px;
}

.saveCustom{
  width:100%;
  min-height:57px;
  border-radius:17px;
  background:linear-gradient(
    90deg,
    #ff2aa8,
    #7044ff,
    #00d8ff,
    #2fff94
  );
  background-size:250% 100%;
  animation:rainbowBg 3s linear infinite;
  font-size:18px;
  font-weight:1000;
  margin-top:7px;
}

/* COSMIC */

body.cosmic-particles::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background-image:
    radial-gradient(#fff 1px,transparent 1px),
    radial-gradient(#fff 1px,transparent 1px);
  background-size:47px 47px,79px 79px;
  background-position:0 0,20px 30px;
  animation:stars 5s linear infinite;
}

@keyframes stars{
  to{background-position:47px 47px,99px 109px}
}

/* FIRE */

body.fire-effect .title{
  filter:
    drop-shadow(0 0 8px #ff3000)
    drop-shadow(0 0 25px #ff8a00);
}

/* MASTER */

body.master-mode .questionArea{
  text-shadow:
    0 0 10px #fff,
    0 0 25px #ffdd00,
    0 0 50px #ff6a00;
}

/* MOBILE */

@media(max-width:500px){
  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .gameCard{
    min-height:320px;
  }

  .key{
    min-height:65px;
  }

  .shopGrid{
    grid-template-columns:1fr;
  }

  .choiceGrid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="title">NEURO KREPELIN</div>
  <div class="subtitle">反射 × 計算 × コンボ</div>

  <div class="menu">

    <div class="timeBox">
      <button class="timeBtn active" id="time30">30 SEC</button>
      <button class="timeBtn" id="time60">60 SEC</button>
    </div>

    <button class="shopBtn" id="shopButton">
      🛒 SHOP
    </button>

  </div>

  <div class="points">
    💰 <span id="points">0</span> P
  </div>

  <button class="startButton" id="startButton">
    START GAME
  </button>

  <div class="stats">

    <div class="stat">
      <small>TIME</small>
      <b id="time">30</b>
    </div>

    <div class="stat">
      <small>正解</small>
      <b id="correct">0</b>
    </div>

    <div class="stat">
      <small>ミス</small>
      <b id="miss">0</b>
    </div>

    <div class="stat">
      <small>BEST COMBO</small>
      <b id="best">0</b>
    </div>

  </div>

  <div class="timer">
    <div class="timerBar" id="timerBar"></div>
  </div>

  <div class="gameCard">

    <div class="scoreLine">
      <span>SCORE <span id="score">0</span></span>
      <span>COMBO <span id="combo">0</span></span>
    </div>

    <div class="questionArea">

      <span id="questionA" class="qpart">READY?</span>
      <span id="qOperator"></span>
      <span id="questionB" class="qpart"></span>

    </div>

    <div class="nextArea">

      <div class="nextLabel">NEXT</div>

      <div class="nextBoxes">
        <div class="nextNumber" id="nextNumber1">-</div>
        <div class="nextNumber" id="nextNumber2">-</div>
      </div>

    </div>

    <div class="keypad">

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>

      <button class="key" data-num="0">0</button>

    </div>

  </div>

</div>


<!-- FEVER -->

<div id="feverOverlay">
  <div class="feverText" id="feverText"></div>
</div>


<!-- RESULT -->

<div class="overlay hidden" id="resultOverlay">

  <div class="modal">

    <div class="modalTitle" id="resultTitle">
      RESULT
    </div>

    <div class="modalSub">
      GAME OVER
    </div>

    <div class="resultStats">

      <div class="resultBox">
        <small>SCORE</small>
        <b id="resultScore">0</b>
      </div>

      <div class="resultBox">
        <small>正解</small>
        <b id="resultCorrect">0</b>
      </div>

      <div class="resultBox">
        <small>ミス</small>
        <b id="resultMiss">0</b>
      </div>

      <div class="resultBox">
        <small>BEST COMBO</small>
        <b id="resultBest">0</b>
      </div>

      <div class="resultBox">
        <small>正答率</small>
        <b id="resultAccuracy">0%</b>
      </div>

      <div class="resultBox">
        <small>獲得POINT</small>
        <b id="resultPoints">0</b>
      </div>

    </div>

    <div class="modalButtons">

      <button class="modalButton" id="retryButton">
        🔄 やり直す
      </button>

      <button class="modalButton alt" id="titleButton">
        🏠 タイトルへ
      </button>

    </div>

  </div>

</div>


<!-- SHOP -->

<div class="overlay hidden" id="shopOverlay">

  <div class="modal">

    <div class="modalTitle">🛒 SHOP</div>

    <div class="modalSub">
      POINTを使って演出を解放
    </div>

    <div class="shopBalance">
      💰 <span id="shopPoints">0</span> P
    </div>

    <div class="shopGrid" id="shopGrid"></div>

    <button class="closeBtn" id="shopClose">
      閉じる
    </button>

  </div>

</div>


<!-- CUSTOMIZER -->

<div class="overlay hidden" id="customOverlay">

  <div class="modal">

    <div class="modalTitle">
      🎨 CUSTOMIZER
    </div>

    <div class="modalSub">
      解放した演出を自由に組み合わせよう
    </div>

    <div class="customSection">
      <h3>🌌 背景</h3>
      <div class="choiceGrid" id="bgChoices"></div>
    </div>

    <div class="customSection">
      <h3>⭕ 正解演出</h3>
      <div class="choiceGrid" id="correctChoices"></div>
    </div>

    <div class="customSection">
      <h3>❌ ミス演出</h3>
      <div class="choiceGrid" id="missChoices"></div>
    </div>

    <div class="customSection">
      <h3>🔥 コンボ演出</h3>
      <div class="choiceGrid" id="comboChoices"></div>
    </div>

    <div class="customSection">
      <h3>🌈 30/50/80/100演出</h3>
      <div class="choiceGrid" id="feverChoices"></div>
    </div>

    <div class="customSection">
      <h3>🔘 ボタン</h3>
      <div class="choiceGrid" id="buttonChoices"></div>
    </div>

    <button class="sampleBtn" id="sampleButton">
      ▶ サンプルを見る
    </button>

    <button class="saveCustom" id="saveCustom">
      💾 この設定を装備
    </button>

    <button class="closeBtn" id="customClose">
      閉じる
    </button>

  </div>

</div>


<script>
"use strict";

/* =========================
   HELPERS
========================= */

const $ = id => document.getElementById(id);

function load(key, fallback){
  try{
    const v=localStorage.getItem(key);
    return v===null ? fallback : JSON.parse(v);
  }catch(e){
    return fallback;
  }
}

function save(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}


/* =========================
   DATA
========================= */

let selectedTime=30;
let playing=false;

let score=0;
let correctCount=0;
let missCount=0;
let combo=0;

let bestCombo=load("neuroKreppelinBest",0);
let totalPoints=load("neuroKreppelinPoints",0);

let currentA=0;
let currentB=0;
let currentAnswer=0;
let nextNumbers=[];

let timerId=null;
let endAt=0;

const owned=load("neuroKreppelinOwned",{});

let equipped=load(
  "neuroKreppelinEquip",
  {
    background:"neon",
    correct:"normal",
    miss:"normal",
    combo:"normal",
    fever:"neon",
    buttons:"neon"
  }
);


/* =========================
   SHOP DATA
========================= */

const SHOP_ITEMS={

  neon:{
    name:"🌈 NEONテーマ",
    price:100,
    desc:"ネオン発光を強化"
  },

  rainbow:{
    name:"✨ RAINBOWテーマ",
    price:250,
    desc:"虹色背景と虹色ボタン"
  },

  cosmic:{
    name:"🌌 COSMIC演出",
    price:400,
    desc:"宇宙背景＋星の演出"
  },

  fire:{
    name:"🔥 FIRE演出",
    price:600,
    desc:"炎の背景＋強烈な発光"
  },

  god:{
    name:"👑 計算神",
    price:500,
    desc:"正解演出をゴールド化"
  },

  reflex:{
    name:"⚡ 反射神経MAX",
    price:800,
    desc:"入力反応・コンボ演出強化"
  },

  master:{
    name:"🧠 NEURO MASTER",
    price:1500,
    desc:"最上位のネオン演出"
  },

  custom:{
    name:"🎨 CUSTOMIZER",
    price:700,
    desc:"解放した演出を自由に組み合わせる"
  }

};


/* =========================
   POINTS
========================= */

function updatePoints(){

  $("points").textContent=totalPoints;
  $("shopPoints").textContent=totalPoints;

}


/* =========================
   SHOP
========================= */

function isOwned(id){
  return !!owned[id];
}

function buyItem(id){

  const item=SHOP_ITEMS[id];

  if(isOwned(id)){
    if(id==="custom"){
      openCustomizer();
    }
    return;
  }

  if(totalPoints < item.price){

    soundMiss();

    alert(
      "ポイントが足りません。\n\n必要: "+
      item.price+"P\n現在: "+
      totalPoints+"P"
    );

    return;
  }

  totalPoints-=item.price;
  owned[id]=true;

  save("neuroKreppelinPoints",totalPoints);
  save("neuroKreppelinOwned",owned);

  soundPurchase();

  renderShop();

}


/* =========================
   SHOP RENDER
========================= */

function renderShop(){

  updatePoints();

  const grid=$("shopGrid");
  grid.innerHTML="";

  Object.entries(SHOP_ITEMS).forEach(([id,item])=>{

    const div=document.createElement("div");
    div.className="shopItem";

    if(isOwned(id)){
      div.classList.add("owned");
    }

    const name=document.createElement("div");
    name.className="shopName";
    name.textContent=item.name;

    const desc=document.createElement("div");
    desc.className="shopDesc";
    desc.textContent=item.desc;

    const btn=document.createElement("button");
    btn.className="shopBuy";

    if(isOwned(id)){

      btn.textContent=
        id==="custom"
        ? "🎨 CUSTOMIZE"
        : "✓ 解放済み";

      if(id!=="custom"){
        btn.disabled=true;
      }

    }else{

      btn.textContent=item.price+" Pで解放";

    }

    btn.onclick=()=>buyItem(id);

    div.appendChild(name);
    div.appendChild(desc);
    div.appendChild(btn);

    grid.appendChild(div);

  });

}


/* =========================
   CUSTOMIZER DATA
========================= */

const customData={

  background:[
    ["neon","🌈 NEON","neon"],
    ["rainbow","✨ RAINBOW","rainbow"],
    ["cosmic","🌌 COSMIC","cosmic"],
    ["fire","🔥 FIRE","fire"]
  ],

  correct:[
    ["normal","通常","normal"],
    ["neon","NEON","neon"],
    ["rainbow","RAINBOW","rainbow"],
    ["god","👑 GOLD","god"],
    ["master","🧠 MASTER","master"]
  ],

  miss:[
    ["normal","通常","normal"],
    ["neon","NEON","neon"],
    ["fire","🔥 FIRE","fire"],
    ["cosmic","🌌 COSMIC","cosmic"]
  ],

  combo:[
    ["normal","通常","normal"],
    ["neon","⚡ NEON","neon"],
    ["fire","🔥 FIRE","fire"],
    ["cosmic","🌌 COSMIC","cosmic"],
    ["master","🧠 MASTER","master"]
  ],

  fever:[
    ["neon","🌈 NEON","neon"],
    ["rainbow","✨ RAINBOW","rainbow"],
    ["cosmic","🌌 COSMIC","cosmic"],
    ["fire","🔥 FIRE","fire"],
    ["master","🧠 MASTER","master"]
  ],

  buttons:[
    ["neon","🌈 NEON","neon"],
    ["rainbow","✨ RAINBOW","rainbow"],
    ["fire","🔥 FIRE","fire"],
    ["cosmic","🌌 COSMIC","cosmic"]
  ]

};


/* =========================
   OWNERSHIP FOR EFFECTS
========================= */

function effectAvailable(type,id){

  if(id==="normal")return true;

  if(id==="neon")return isOwned("neon");

  if(id==="rainbow")return isOwned("rainbow");

  if(id==="cosmic")return isOwned("cosmic");

  if(id==="fire")return isOwned("fire");

  if(id==="god")return isOwned("god");

  if(id==="master")return isOwned("master");

  return false;
}


/* =========================
   CUSTOMIZER RENDER
========================= */

function renderChoices(type,elementId){

  const box=$(elementId);
  box.innerHTML="";

  customData[type].forEach(item=>{

    const id=item[0];
    const label=item[1];

    const btn=document.createElement("button");
    btn.className="choice";

    const available=effectAvailable(type,id);

    if(!available){
      btn.classList.add("locked");
      btn.textContent="🔒 "+label;
    }else{
      btn.textContent=label;
    }

    if(equipped[type]===id){
      btn.classList.add("selected");
    }

    btn.onclick=()=>{

      if(!available){

        soundMiss();

        return;
      }

      equipped[type]=id;

      renderCustomizer();

      applyEquipped();

    };

    box.appendChild(btn);

  });

}

function renderCustomizer(){

  renderChoices("background","bgChoices");
  renderChoices("correct","correctChoices");
  renderChoices("miss","missChoices");
  renderChoices("combo","comboChoices");
  renderChoices("fever","feverChoices");
  renderChoices("buttons","buttonChoices");

}


/* =========================
   APPLY EQUIPMENT
========================= */

function clearThemes(){

  document.body.classList.remove(
    "theme-rainbow",
    "theme-cosmic",
    "theme-fire",
    "neon-strong",
    "rainbow-buttons",
    "fire-buttons",
    "cosmic-particles",
    "fire-effect",
    "master-mode"
  );

}

function applyEquipped(){

  clearThemes();

  const bg=equipped.background;

  if(bg==="rainbow"){
    document.body.classList.add("theme-rainbow");
  }

  if(bg==="cosmic"){
    document.body.classList.add("theme-cosmic","cosmic-particles");
  }

  if(bg==="fire"){
    document.body.classList.add("theme-fire","fire-effect");
  }

  if(isOwned("neon")){
    document.body.classList.add("neon-strong");
  }

  if(equipped.buttons==="rainbow"){
    document.body.classList.add("rainbow-buttons");
  }

  if(equipped.buttons==="fire"){
    document.body.classList.add("fire-buttons");
  }

  if(equipped.buttons==="cosmic"){
    document.body.classList.add("cosmic-particles");
  }

  if(equipped.correct==="master" ||
     equipped.combo==="master"){
    document.body.classList.add("master-mode");
  }

}


/* =========================
   CUSTOMIZER OPEN
========================= */

function openCustomizer(){

  if(!isOwned("custom")){
    return;
  }

  renderCustomizer();

  $("customOverlay").classList.remove("hidden");

}

$("customClose").onclick=()=>{
  $("customOverlay").classList.add("hidden");
};

$("saveCustom").onclick=()=>{

  save("neuroKreppelinEquip",equipped);

  applyEquipped();

  soundPurchase();

  $("customOverlay").classList.add("hidden");

};


/* =========================
   SAMPLE
========================= */

$("sampleButton").onclick=()=>{

  const type="fever";

  const selected=equipped[type];

  if(selected==="rainbow"){
    document.body.classList.add("theme-rainbow");
  }

  if(selected==="cosmic"){
    document.body.classList.add("theme-cosmic","cosmic-particles");
  }

  if(selected==="fire"){
    document.body.classList.add("theme-fire","fire-effect");
  }

  if(selected==="master"){
    document.body.classList.add("master-mode");
  }

  showFever(
    selected==="fire"
      ? "🔥 FIRE SAMPLE!"
      : selected==="cosmic"
      ? "🌌 COSMIC SAMPLE!"
      : selected==="rainbow"
      ? "🌈 RAINBOW SAMPLE!"
      : selected==="master"
      ? "🧠 MASTER SAMPLE!"
      : "⚡ NEON SAMPLE!",
    3000
  );

};


/* =========================
   AUDIO
========================= */

let audioCtx=null;

function getAudio(){

  if(!audioCtx){
    audioCtx=
      new(window.AudioContext||
          window.webkitAudioContext)();
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  return audioCtx;
}

function tone(freq,duration,type,gain,delay=0){

  const ctx=getAudio();

  const osc=ctx.createOscillator();
  const g=ctx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  g.gain.setValueAtTime(0,ctx.currentTime+delay);

  g.gain.linearRampToValueAtTime(
    gain,
    ctx.currentTime+delay+.008
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime+delay+duration
  );

  osc.connect(g);
  g.connect(ctx.destination);

  osc.start(ctx.currentTime+delay);
  osc.stop(ctx.currentTime+delay+duration+.02);
}

function soundCorrect(){

  const type=equipped.correct;

  if(type==="god"){
    tone(880,.07,"sine",.08);
    tone(1320,.09,"sine",.055,.045);
    return;
  }

  if(type==="master"){
    tone(660,.05,"sine",.07);
    tone(990,.06,"sine",.06,.045);
    tone(1480,.08,"sine",.05,.09);
    return;
  }

  if(type==="rainbow"){
    tone(660,.05,"sine",.07);
    tone(880,.05,"sine",.06,.04);
    tone(1100,.07,"sine",.05,.08);
    return;
  }

  tone(760,.07,"sine",.07);

}

function soundMiss(){

  const type=equipped.miss;

  if(type==="fire"){
    tone(120,.12,"sawtooth",.07);
    return;
  }

  if(type==="cosmic"){
    tone(230,.15,"sine",.055);
    return;
  }

  tone(180,.11,"square",.06);

}

function soundCombo(){

  const type=equipped.combo;

  if(type==="fire"){
    tone(180,.06,"sawtooth",.06);
    tone(450,.07,"sawtooth",.055,.06);
    tone(760,.09,"sawtooth",.05,.12);
    return;
  }

  if(type==="cosmic"){
    tone(600,.06,"sine",.06);
    tone(900,.07,"sine",.055,.07);
    tone(1300,.1,"sine",.05,.14);
    return;
  }

  if(type==="master"){
    tone(850,.06,"sine",.07);
    tone(1100,.08,"sine",.06,.06);
    tone(1500,.1,"sine",.055,.13);
    return;
  }

  tone(850,.06,"sine",.06);
  tone(1100,.08,"sine",.05,.06);

}

function soundMilestone(){

  tone(660,.09,"sine",.08);
  tone(880,.1,"sine",.07,.08);
  tone(1100,.12,"sine",.065,.17);
  tone(1500,.16,"sine",.055,.28);

}

function soundPurchase(){

  tone(500,.06,"sine",.06);
  tone(800,.08,"sine",.06,.07);
  tone(1200,.12,"sine",.05,.15);

}


/* =========================
   RANDOM
========================= */

function randomAddend(){

  return Math.floor(Math.random()*8)+2;

}


/* =========================
   QUESTION
========================= */

function createQuestion(){

  currentA=randomAddend();
  currentB=randomAddend();

  nextNumbers=[
    randomAddend(),
    randomAddend()
  ];

  currentAnswer=(currentA+currentB)%10;

  renderQuestion(false);
  renderNext(false);

}

function renderQuestion(animate=true){

  $("questionA").textContent=currentA;
  $("qOperator").textContent="+";
  $("questionB").textContent=currentB;

  if(animate){

    $("qOperator").classList.remove("joinIn");
    $("questionB").classList.remove("joinIn");

    void $("questionB").offsetWidth;

    $("qOperator").classList.add("joinIn");
    $("questionB").classList.add("joinIn");

  }

}

function renderNext(animate=true){

  $("nextNumber1").textContent=
    nextNumbers[0] ?? "-";

  $("nextNumber2").textContent=
    nextNumbers[1] ?? "-";

  if(animate){

    $("nextNumber1").classList.remove("slide");
    $("nextNumber2").classList.remove("slide");

    void $("nextNumber1").offsetWidth;

    $("nextNumber1").classList.add("slide");
    $("nextNumber2").classList.add("slide");

  }

}


/* =========================
   ADVANCE
========================= */

function advanceQuestion(){

  currentA=currentB;

  currentB=nextNumbers.shift();

  nextNumbers.push(randomAddend());

  currentAnswer=(currentA+currentB)%10;

  renderQuestion(true);
  renderNext(true);

}


/* =========================
   UI
========================= */

function updateUI(){

  $("correct").textContent=correctCount;
  $("miss").textContent=missCount;
  $("best").textContent=bestCombo;
  $("score").textContent=score;
  $("combo").textContent=combo;
  $("time").textContent=
    Math.max(0,Math.ceil((endAt-Date.now())/1000));

}


/* =========================
   PARTICLES
========================= */

function particles(count=20){

  for(let i=0;i<count;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=(50+Math.random()*10-5)+"%";
    p.style.top=(50+Math.random()*10-5)+"%";

    p.style.setProperty(
      "--x",
      ((Math.random()-.5)*500)+"px"
    );

    p.style.setProperty(
      "--y",
      ((Math.random()-.5)*500)+"px"
    );

    p.style.background=
      `hsl(${Math.random()*360},100%,65%)`;

    document.body.appendChild(p);

    setTimeout(()=>p.remove(),1100);

  }

}


/* =========================
   FEVER
========================= */

let feverTimer=null;

function showFever(text,duration=3000){

  clearTimeout(feverTimer);

  $("feverText").textContent=text;

  $("feverOverlay").classList.add("show");

  particles(35);

  feverTimer=setTimeout(()=>{

    $("feverOverlay").classList.remove("show");

  },duration);

}


/* =========================
   MILESTONE
========================= */

function milestone(n){

  const messages={

    30:"🔥 30 CORRECT! 🔥",
    50:"⚡ 50 CORRECT! ⚡",
    80:"🌈 80 CORRECT! 🌈",
    100:"👑 100 CORRECT! 👑"

  };

  const bonus={

    30:100,
    50:200,
    80:400,
    100:800

  };

  if(!messages[n])return;

  totalPoints+=bonus[n];

  save("neuroKreppelinPoints",totalPoints);

  updatePoints();

  soundMilestone();

  if(equipped.fever==="rainbow"){
    document.body.classList.add("theme-rainbow");
  }

  if(equipped.fever==="cosmic"){
    document.body.classList.add("theme-cosmic","cosmic-particles");
  }

  if(equipped.fever==="fire"){
    document.body.classList.add("theme-fire","fire-effect");
  }

  if(equipped.fever==="master"){
    document.body.classList.add("master-mode");
  }

  showFever(messages[n],3000);

}


/* =========================
   ANSWER
========================= */

function answer(n){

  if(!playing)return;

  if(n===currentAnswer){

    correctCount++;

    combo++;

    if(combo>bestCombo){

      bestCombo=combo;

      save("neuroKreppelinBest",bestCombo);

    }

    score+=
      10+
      (combo>=5 ? Math.min(combo,20):0);

    soundCorrect();

    if(combo>=3){
      soundCombo();
    }

    if(
      [30,50,80,100].includes(correctCount)
    ){
      milestone(correctCount);
    }

    advanceQuestion();

    updateUI();

  }else{

    /*
      ★重要
      ハズレでは問題を進めない
    */

    missCount++;

    combo=0;

    soundMiss();

    updateUI();

    document.body.classList.remove("hit");

    void document.body.offsetWidth;

    document.body.classList.add("hit");

  }

}


/* =========================
   START
========================= */

$("startButton").onclick=()=>{

  if(playing)return;

  startGame();

};

function startGame(){

  getAudio();

  playing=true;

  score=0;
  correctCount=0;
  missCount=0;
  combo=0;

  $("resultOverlay").classList.add("hidden");

  $("startButton").textContent="PLAYING...";

  createQuestion();

  endAt=
    Date.now()+
    selectedTime*1000;

  clearInterval(timerId);

  timerId=setInterval(()=>{

    const remaining=
      Math.max(0,endAt-Date.now());

    const ratio=
      remaining/(selectedTime*1000);

    $("timerBar").style.width=
      (ratio*100)+"%";

    updateUI();

    if(remaining<=0){

      endGame();

    }

  },50);

  updateUI();

}


/* =========================
   END
========================= */

function endGame(){

  if(!playing)return;

  playing=false;

  clearInterval(timerId);

  $("startButton").textContent="START GAME";

  const earned=score;

  totalPoints+=earned;

  save("neuroKreppelinPoints",totalPoints);

  updatePoints();

  const attempts=
    correctCount+missCount;

  const accuracy=
    attempts
      ? Math.round(correctCount/attempts*100)
      : 0;

  let title="RESULT";

  if(bestCombo>=20){
    title="🔥 LEGENDARY!!! 🔥";
  }else if(bestCombo>=15){
    title="⚡ AMAZING!! ⚡";
  }else if(correctCount>=30){
    title="🌈 GREAT!! 🌈";
  }else if(correctCount>=20 && missCount<=5){
    title="✨ NICE PLAY! ✨";
  }else if(missCount<=3){
    title="🎯 ACCURATE!";
  }

  $("resultTitle").textContent=title;
  $("resultScore").textContent=score;
  $("resultCorrect").textContent=correctCount;
  $("resultMiss").textContent=missCount;
  $("resultBest").textContent=bestCombo;
  $("resultAccuracy").textContent=accuracy+"%";
  $("resultPoints").textContent=earned;

  $("resultOverlay").classList.remove("hidden");

  particles(45);

  setTimeout(()=>{

    document
      .querySelectorAll(".particle")
      .forEach(p=>p.remove());

  },3000);

}


/* =========================
   RETRY
========================= */

$("retryButton").onclick=()=>{

  $("resultOverlay").classList.add("hidden");

  startGame();

};


/* =========================
   TITLE
========================= */

$("titleButton").onclick=()=>{

  $("resultOverlay").classList.add("hidden");

  playing=false;

  clearInterval(timerId);

  score=0;
  correctCount=0;
  missCount=0;
  combo=0;

  $("time").textContent=selectedTime;
  $("correct").textContent="0";
  $("miss").textContent="0";
  $("score").textContent="0";
  $("combo").textContent="0";

  $("questionA").textContent="READY?";
  $("qOperator").textContent="";
  $("questionB").textContent="";

  $("nextNumber1").textContent="-";
  $("nextNumber2").textContent="-";

  $("startButton").textContent="START GAME";

};


/* =========================
   TIME SELECT
========================= */

$("time30").onclick=()=>{

  if(playing)return;

  selectedTime=30;

  $("time30").classList.add("active");
  $("time60").classList.remove("active");

  $("time").textContent="30";

};

$("time60").onclick=()=>{

  if(playing)return;

  selectedTime=60;

  $("time60").classList.add("active");
  $("time30").classList.remove("active");

  $("time").textContent="60";

};


/* =========================
   KEYPAD
========================= */

document
  .querySelectorAll(".key")
  .forEach(button=>{

    button.onclick=()=>{

      answer(
        Number(button.dataset.num)
      );

    };

  });


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",e=>{

  if(!playing)return;

  if(/^[0-9]$/.test(e.key)){

    answer(Number(e.key));

  }

});


/* =========================
   SHOP OPEN
========================= */

$("shopButton").onclick=()=>{

  renderShop();

  $("shopOverlay").classList.remove("hidden");

};

$("shopClose").onclick=()=>{

  $("shopOverlay").classList.add("hidden");

};


/* =========================
   INIT
========================= */

updatePoints();

$("best").textContent=bestCombo;
$("time").textContent=selectedTime;

applyEquipped();

</script>

</body>
</html>
