<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEURO KREPELIN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 15%,#4c147d,transparent 32%),
    radial-gradient(circle at 85% 25%,#004b75,transparent 35%),
    radial-gradient(circle at 50% 100%,#66104f,transparent 40%),
    linear-gradient(135deg,#04000d,#090026,#00152d);
  background-size:180% 180%;
  animation:bgMove 10s ease-in-out infinite alternate;
}

body.theme-rainbow{
  background:
    linear-gradient(
      125deg,
      #ff006e,
      #6a00ff,
      #00b7ff,
      #00ff9d,
      #ffe600,
      #ff006e
    );
  background-size:400% 400%;
  animation:rainbowBg 7s linear infinite;
}

body.theme-cosmic{
  background:
    radial-gradient(circle at 20% 20%,#5420b8,transparent 28%),
    radial-gradient(circle at 80% 30%,#006d9c,transparent 30%),
    radial-gradient(circle at 50% 80%,#150060,transparent 35%),
    #02020c;
}

body.theme-fire{
  background:
    radial-gradient(circle at 50% 100%,#ff2600,transparent 40%),
    radial-gradient(circle at 20% 70%,#ff7b00,transparent 30%),
    linear-gradient(#180000,#060000);
}

@keyframes bgMove{
  from{background-position:0 0}
  to{background-position:100% 100%}
}

@keyframes rainbowBg{
  to{background-position:400% 0}
}

button{
  font:inherit;
  color:#fff;
  border:0;
}

.hidden{
  display:none!important;
}

.app{
  width:min(760px,100%);
  margin:auto;
  padding:14px 13px 40px;
}

.title{
  text-align:center;
  font-size:clamp(32px,9vw,62px);
  line-height:1;
  font-weight:1000;
  letter-spacing:2px;
  margin:8px 0 6px;
  color:transparent;
  background:
    linear-gradient(
      90deg,
      #ff28b8,
      #754cff,
      #00ddff,
      #32ff91,
      #ffe500,
      #ff28b8
    );
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  animation:titleMove 3s linear infinite;
  filter:
    drop-shadow(0 0 7px #ff28b8)
    drop-shadow(0 0 15px #00ddff);
}

@keyframes titleMove{
  to{background-position:300% center}
}

.subtitle{
  text-align:center;
  font-size:12px;
  font-weight:900;
  letter-spacing:3px;
  opacity:.8;
  margin-bottom:13px;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.timeBox{
  display:flex;
  gap:7px;
}

.timeBtn,
.shopBtn{
  min-height:50px;
  border-radius:16px;
  font-weight:1000;
  background:linear-gradient(135deg,#211c54,#151326);
  border:2px solid #6258ff;
  box-shadow:0 0 12px rgba(101,83,255,.55);
}

.timeBtn{
  flex:1;
  font-size:15px;
}

.timeBtn.active{
  background:linear-gradient(135deg,#ff27b8,#643cff);
  border-color:#fff;
  box-shadow:0 0 12px #ff35c0,0 0 25px #693cff;
}

.shopBtn{
  background:linear-gradient(135deg,#ff9d00,#ff2d72);
  border-color:#ffd86b;
}

.points{
  text-align:center;
  margin-top:8px;
  font-weight:1000;
  font-size:15px;
  color:#ffe66b;
  text-shadow:0 0 10px #ffb000;
}

/* START */

.startButton{
  width:100%;
  margin:12px 0 14px;
  min-height:82px;
  border-radius:25px;
  font-size:clamp(26px,7vw,40px);
  font-weight:1000;
  letter-spacing:2px;
  background:
    linear-gradient(
      90deg,
      #ff239f,
      #7144ff,
      #00cfff,
      #27f28a,
      #ffdb00,
      #ff239f
    );
  background-size:300% auto;
  animation:startRainbow 3s linear infinite;
  box-shadow:
    0 0 12px #ff32b6,
    0 0 28px #6945ff,
    0 0 50px rgba(0,220,255,.4);
  border:3px solid #fff;
  text-shadow:0 2px 5px #000;
  transition:.12s;
}

.startButton:active{
  transform:scale(.96);
}

@keyframes startRainbow{
  to{background-position:300% center}
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:9px;
}

.stat{
  background:rgba(10,5,30,.7);
  border:1px solid rgba(255,255,255,.22);
  border-radius:13px;
  padding:8px 3px;
  text-align:center;
}

.stat small{
  display:block;
  font-size:9px;
  opacity:.65;
  font-weight:900;
}

.stat b{
  font-size:19px;
}

/* TIMER */

.timer{
  height:9px;
  border-radius:20px;
  background:#100c25;
  overflow:hidden;
  margin-bottom:12px;
}

.timerBar{
  height:100%;
  width:100%;
  transform-origin:left;
  background:linear-gradient(90deg,#00ff9d,#00d9ff,#784cff,#ff2eae);
  box-shadow:0 0 10px #00ddff;
}

/* GAME */

.gameCard{
  position:relative;
  min-height:340px;
  padding:16px 10px 18px;
  border-radius:28px;
  background:rgba(5,3,20,.72);
  border:2px solid rgba(255,255,255,.15);
  box-shadow:
    0 0 20px rgba(88,66,255,.25),
    inset 0 0 30px rgba(255,255,255,.025);
}

.scoreLine{
  display:flex;
  justify-content:space-between;
  font-weight:1000;
  padding:0 6px;
  margin-bottom:9px;
}

#score{
  color:#6affd1;
  text-shadow:0 0 10px #00ffb3;
}

#combo{
  color:#ffe75c;
  text-shadow:0 0 10px #ffb700;
}

.questionArea{
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:clamp(54px,17vw,105px);
  font-weight:1000;
  text-shadow:
    0 0 8px #fff,
    0 0 20px #8c65ff;
  position:relative;
}

.qpart{
  display:inline-block;
  min-width:55px;
  text-align:center;
}

#qOperator{
  display:inline-block;
  min-width:35px;
}

.joinIn{
  animation:joinIn .23s cubic-bezier(.2,1.5,.3,1);
}

@keyframes joinIn{
  from{
    transform:translateX(70px) scale(1.2);
    opacity:0;
  }
  to{
    transform:translateX(0) scale(1);
    opacity:1;
  }
}

/* NEXT */

.nextArea{
  margin:2px auto 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.nextLabel{
  font-size:11px;
  font-weight:1000;
  letter-spacing:4px;
  opacity:.65;
  margin-bottom:5px;
}

.nextBoxes{
  display:flex;
  gap:10px;
}

.nextNumber{
  width:78px;
  height:65px;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:1000;
  background:linear-gradient(135deg,#1f145d,#30208b);
  border:2px solid #8273ff;
  box-shadow:0 0 14px #5f4bff;
}

.nextNumber.slide{
  animation:nextSlide .22s ease-out;
}

@keyframes nextSlide{
  from{
    transform:translateX(25px) scale(.8);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

/* KEYPAD */

.keypad{
  width:min(390px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.key{
  min-height:70px;
  border-radius:21px;
  font-size:30px;
  font-weight:1000;
  background:linear-gradient(145deg,#2b246a,#15112f);
  border:2px solid #655aff;
  box-shadow:
    0 0 10px rgba(95,75,255,.55),
    inset 0 0 9px rgba(255,255,255,.06);
  transition:.1s;
}

.key:nth-child(1){border-color:#ff4bb8}
.key:nth-child(2){border-color:#ff6b71}
.key:nth-child(3){border-color:#ffb13b}
.key:nth-child(4){border-color:#ffe247}
.key:nth-child(5){border-color:#6dff72}
.key:nth-child(6){border-color:#35e8ff}
.key:nth-child(7){border-color:#4c9dff}
.key:nth-child(8){border-color:#906dff}
.key:nth-child(9){border-color:#d05bff}
.key:nth-child(10){
  grid-column:2;
  border-color:#ff54db;
}

.key:active{
  transform:scale(.91);
  filter:brightness(1.5);
}

body.neon-strong .gameCard,
body.neon-strong .key,
body.neon-strong .nextNumber{
  box-shadow:
    0 0 15px currentColor,
    0 0 35px rgba(100,80,255,.7);
}

body.rainbow-buttons .key{
  background:
    linear-gradient(
      90deg,
      #ff247f,
      #703cff,
      #00d9ff,
      #2aff90,
      #ffe600
    );
  background-size:250% 100%;
  animation:rainbowBg 2.5s linear infinite;
}

body.fire-buttons .key{
  background:linear-gradient(145deg,#ff4100,#8e0c00,#290000);
  border-color:#ff9b00;
  box-shadow:0 0 15px #ff4800,0 0 30px #ff9000;
}

/* HIT */

.hit{
  animation:hitFlash .1s ease-out;
}

@keyframes hitFlash{
  0%{filter:brightness(1)}
  50%{filter:brightness(1.5)}
  100%{filter:brightness(1)}
}

/* FEVER */

#feverOverlay{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.04);
}

#feverOverlay.show{
  display:flex;
  animation:feverScreen .25s infinite alternate;
}

.feverText{
  font-size:clamp(42px,12vw,95px);
  font-weight:1000;
  text-align:center;
  color:#fff;
  text-shadow:
    0 0 8px #fff,
    0 0 20px #ff29b8,
    0 0 40px #00d9ff;
  animation:feverPop .35s infinite alternate;
}

@keyframes feverScreen{
  from{background:rgba(255,0,140,.03)}
  to{background:rgba(0,220,255,.16)}
}

@keyframes feverPop{
  from{transform:scale(.96) rotate(-1deg)}
  to{transform:scale(1.05) rotate(1deg)}
}

/* PARTICLES */

.particle{
  position:fixed;
  pointer-events:none;
  width:8px;
  height:8px;
  border-radius:50%;
  z-index:60;
  animation:particleFly 1s ease-out forwards;
}

@keyframes particleFly{
  from{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* OVERLAYS */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(3,0,15,.91);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal{
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:27px;
  background:linear-gradient(145deg,#130d35,#08051b);
  border:2px solid #715cff;
  box-shadow:
    0 0 25px #543dff,
    0 0 60px rgba(255,30,180,.2);
  padding:20px;
}

.modalTitle{
  text-align:center;
  font-size:29px;
  font-weight:1000;
  margin-bottom:5px;
}

.modalSub{
  text-align:center;
  opacity:.65;
  font-size:12px;
  margin-bottom:16px;
}

.resultStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.resultBox{
  border-radius:15px;
  padding:12px;
  background:#171033;
  border:1px solid #44377f;
  text-align:center;
}

.resultBox small{
  display:block;
  opacity:.6;
}

.resultBox b{
  font-size:25px;
}

.modalButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}

.modalButton{
  min-height:55px;
  border-radius:17px;
  background:linear-gradient(135deg,#6544ff,#b52cff);
  font-weight:1000;
  border:2px solid #9d8cff;
}

.modalButton.alt{
  background:linear-gradient(135deg,#272054,#15132c);
}

/* SHOP */

.shopBalance{
  text-align:center;
  color:#ffe45d;
  font-weight:1000;
  margin-bottom:12px;
}

.shopGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.shopItem{
  padding:13px 10px;
  border-radius:17px;
  background:linear-gradient(145deg,#1d163f,#0e0a23);
  border:1px solid #493c83;
}

.shopItem.owned{
  border-color:#36ffbd;
  box-shadow:0 0 13px rgba(0,255,180,.25);
}

.shopName{
  font-weight:1000;
  font-size:15px;
}

.shopDesc{
  font-size:10px;
  opacity:.65;
  min-height:31px;
  margin:5px 0 8px;
}

.shopBuy{
  width:100%;
  min-height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,#593aff,#d52cff);
  font-weight:1000;
}

.shopBuy:disabled{
  opacity:.4;
}

.closeBtn{
  width:100%;
  margin-top:12px;
  min-height:47px;
  border-radius:14px;
  background:#211a43;
  border:1px solid #56498b;
  font-weight:1000;
}

/* CUSTOMIZER */

.customSection{
  margin-bottom:15px;
}

.customSection h3{
  font-size:14px;
  margin:0 0 7px;
}

.choiceGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.choice{
  min-height:47px;
  border-radius:13px;
  background:#17112f;
  border:1px solid #493d76;
  font-size:12px;
  font-weight:900;
  padding:5px;
}

.choice.selected{
  border:2px solid #fff;
  background:linear-gradient(135deg,#633cff,#e62bb4);
  box-shadow:0 0 12px #874bff;
}

.choice.locked{
  opacity:.35;
}

.sampleBtn{
  width:100%;
  min-height:53px;
  border-radius:16px;
  background:linear-gradient(135deg,#ff9c00,#ff2789);
  font-weight:1000;
  margin-top:5px;
}

.saveCustom{
  width:100%;
  min-height:57px;
  border-radius:17px;
  background:linear-gradient(
    90deg,
    #ff2aa8,
    #7044ff,
    #00d8ff,
    #2fff94
  );
  background-size:250% 100%;
  animation:rainbowBg 3s linear infinite;
  font-size:18px;
  font-weight:1000;
  margin-top:7px;
}

/* COSMIC */

body.cosmic-particles::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background-image:
    radial-gradient(#fff 1px,transparent 1px),
    radial-gradient(#fff 1px,transparent 1px);
  background-size:47px 47px,79px 79px;
  background-position:0 0,20px 30px;
  animation:stars 5s linear infinite;
}

@keyframes stars{
  to{background-position:47px 47px,99px 109px}
}

/* FIRE */

body.fire-effect .title{
  filter:
    drop-shadow(0 0 8px #ff3000)
    drop-shadow(0 0 25px #ff8a00);
}

/* MASTER */

body.master-mode .questionArea{
  text-shadow:
    0 0 10px #fff,
    0 0 25px #ffdd00,
    0 0 50px #ff6a00;
}

/* MOBILE */

@media(max-width:500px){
  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .gameCard{
    min-height:320px;
  }

  .key{
    min-height:65px;
  }

  .shopGrid{
    grid-template-columns:1fr;
  }

  .choiceGrid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="title">NEURO KREPELIN</div>
  <div class="subtitle">反射 × 計算 × コンボ</div>

  <div class="menu">

    <div class="timeBox">
      <button class="timeBtn active" id="time30">30 SEC</button>
      <button class="timeBtn" id="time60">60 SEC</button>
    </div>

    <button class="shopBtn" id="shopButton">
      🛒 SHOP
    </button>

  </div>

  <div class="points">
    💰 <span id="points">0</span> P
  </div>

  <button class="startButton" id="startButton">
    START GAME
  </button>

  <div class="stats">

    <div class="stat">
      <small>TIME</small>
      <b id="time">30</b>
    </div>

    <div class="stat">
      <small>正解</small>
      <b id="correct">0</b>
    </div>

    <div class="stat">
      <small>ミス</small>
      <b id="miss">0</b>
    </div>

    <div class="stat">
      <small>BEST COMBO</small>
      <b id="best">0</b>
    </div>

  </div>

  <div class="timer">
    <div class="timerBar" id="timerBar"></div>
  </div>

  <div class="gameCard">

    <div class="scoreLine">
      <span>SCORE <span id="score">0</span></span>
      <span>COMBO <span id="combo">0</span></span>
    </div>

    <div class="questionArea">

      <span id="questionA" class="qpart">READY?</span>
      <span id="qOperator"></span>
      <span id="questionB" class="qpart"></span>

    </div>

    <div class="nextArea">

      <div class="nextLabel">NEXT</div>

      <div class="nextBoxes">
        <div class="nextNumber" id="nextNumber1">-</div>
        <div class="nextNumber" id="nextNumber2">-</div>
      </div>

    </div>

    <div class="keypad">

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>

      <button class="key" data-num="0">0</button>

    </div>

  </div>

</div>


<!-- FEVER -->

<div id="feverOverlay">
  <div class="feverText" id="feverText"></div>
</div>


<!-- RESULT -->

<div class="overlay hidden" id="resultOverlay">

  <div class="modal">

    <div class="modalTitle" id="resultTitle">
      RESULT
    </div>

    <div class="modalSub">
      GAME OVER
    </div>

    <div class="resultStats">

      <div class="resultBox">
        <small>SCORE</small>
        <b id="resultScore">0</b>
      </div>

      <div class="resultBox">
        <small>正解</small>
        <b id="resultCorrect">0</b>
      </div>

      <div class="resultBox">
        <small>ミス</small>
        <b id="resultMiss">0</b>
      </div>

      <div class="resultBox">
        <small>BEST COMBO</small>
        <b id="resultBest">0</b>
      </div>

      <div class="resultBox">
        <small>正答率</small>
        <b id="resultAccuracy">0%</b>
      </div>

      <div class="resultBox">
        <small>獲得POINT</small>
        <b id="resultPoints">0</b>
      </div>

    </div>

    <div class="modalButtons">

      <button class="modalButton" id="retryButton">
        🔄 やり直す
      </button>

      <button class="modalButton alt" id="titleButton">
        🏠 タイトルへ
      </button>

    </div>

  </div>

</div>


<!-- SHOP -->

<div class="overlay hidden" id="shopOverlay">

  <div class="modal">

    <div class="modalTitle">🛒 SHOP</div>

    <div class="modalSub">
      POINTを使って演出を解放
    </div>

    <div class="shopBalance">
      💰 <span id="shopPoints">0</span> P
    </div>

    <div class="shopGrid" id="shopGrid"></div>

    <button class="closeBtn" id="shopClose">
      閉じる
    </button>

  </div>

</div>


<!-- CUSTOMIZER -->

<div class="overlay hidden" id="customOverlay">

  <div class="modal">

    <div class="modalTitle">
      🎨 CUSTOMIZER
    </div>

    <div class="modalSub">
      解放した演出を自由に組み合わせよう
    </div>

    <div class="customSection">
      <h3>🌌 背景</h3>
      <div class="choiceGrid" id="bgChoices"></div>
    </div>

    <div class="customSection">
      <h3>⭕ 正解演出</h3>
      <div class="choiceGrid" id="correctChoices"></div>
    </div>

    <div class="customSection">
      <h3>❌ ミス演出</h3>
      <div class="choiceGrid" id="missChoices"></div>
    </div>

    <div class="customSection">
      <h3>🔥 コンボ演出</h3>
      <div class="choiceGrid" id="comboChoices"></div>
    </div>

    <div class="customSection">
      <h3>🌈 30/50/80/100演出</h3>
      <div class="choiceGrid" id="feverChoices"></div>
    </div>

    <div class="customSection">
      <h3>🔘 ボタン</h3>
      <div class="choiceGrid" id="buttonChoices"></div>
    </div>

    <button class="sampleBtn" id="sampleButton">
      ▶ サンプルを見る
    </button>

    <button class="saveCustom" id="saveCustom">

/* =========================
   AUDIO
========================= */

let audioCtx=null;

function getAudio(){

  if(!audioCtx){
    audioCtx=
      new(window.AudioContext||
          window.webkitAudioContext)();
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  return audioCtx;
}

function tone(freq,duration,type,gain,delay=0){

  const ctx=getAudio();

  const osc=ctx.createOscillator();
  const g=ctx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  g.gain.setValueAtTime(0,ctx.currentTime+delay);

  g.gain.linearRampToValueAtTime(
    gain,
    ctx.currentTime+delay+.008
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime+delay+duration
  );

  osc.connect(g);
  g.connect(ctx.destination);

  osc.start(ctx.currentTime+delay);
  osc.stop(ctx.currentTime+delay+duration+.02);
}

function soundCorrect(){

  const type=equipped.correct;

  if(type==="god"){
    tone(880,.07,"sine",.08);
    tone(1320,.09,"sine",.055,.045);
    return;
  }

  if(type==="master"){
    tone(660,.05,"sine",.07);
    tone(990,.06,"sine",.06,.045);
    tone(1480,.08,"sine",.05,.09);
    return;
  }

  if(type==="rainbow"){
    tone(660,.05,"sine",.07);
    tone(880,.05,"sine",.06,.04);
    tone(1100,.07,"sine",.05,.08);
    return;
  }

  tone(760,.07,"sine",.07);

}

function soundMiss(){

  const type=equipped.miss;

  if(type==="fire"){
    tone(120,.12,"sawtooth",.07);
    return;
  }

  if(type==="cosmic"){
    tone(230,.15,"sine",.055);
    return;
  }

  tone(180,.11,"square",.06);

}

function soundCombo(){

  const type=equipped.combo;

  if(type==="fire"){
    tone(180,.06,"sawtooth",.06);
    tone(450,.07,"sawtooth",.055,.06);
    tone(760,.09,"sawtooth",.05,.12);
    return;
  }

  if(type==="cosmic"){
    tone(600,.06,"sine",.06);
    tone(900,.07,"sine",.055,.07);
    tone(1300,.1,"sine",.05,.14);
    return;
  }

  if(type==="master"){
    tone(850,.06,"sine",.07);
    tone(1100,.08,"sine",.06,.06);
    tone(1500,.1,"sine",.055,.13);
    return;
  }

  tone(850,.06,"sine",.06);
  tone(1100,.08,"sine",.05,.06);

}

function soundMilestone(){

  tone(660,.09,"sine",.08);
  tone(880,.1,"sine",.07,.08);
  tone(1100,.12,"sine",.065,.17);
  tone(1500,.16,"sine",.055,.28);

}

function soundPurchase(){

  tone(500,.06,"sine",.06);
  tone(800,.08,"sine",.06,.07);
  tone(1200,.12,"sine",.05,.15);

function randomAddend(){

  return Math.floor(Math.random()*8)+2;

}


/* =========================
   QUESTION
========================= */

function createQuestion(){

  currentA=randomAddend();
  currentB=randomAddend();

  nextNumbers=[
    randomAddend(),
    randomAddend()
  ];

  currentAnswer=(currentA+currentB)%10;

  renderQuestion(false);
  renderNext(false);

}

function renderQuestion(animate=true){

  $("questionA").textContent=currentA;
  $("qOperator").textContent="+";
  $("questionB").textContent=currentB;

  if(animate){

    $("qOperator").classList.remove("joinIn");
    $("questionB").classList.remove("joinIn");

    void $("questionB").offsetWidth;

    $("qOperator").classList.add("joinIn");
    $("questionB").classList.add("joinIn");

  }

}

function renderNext(animate=true){

  $("nextNumber1").textContent=
    nextNumbers[0] ?? "-";

  $("nextNumber2").textContent=
    nextNumbers[1] ?? "-";

  if(animate){

    $("nextNumber1").classList.remove("slide");
    $("nextNumber2").classList.remove("slide");

    void $("nextNumber1").offsetWidth;

    $("nextNumber1").classList.add("slide");
    $("nextNumber2").classList.add("slide");

  }

}


/* =========================
   ADVANCE
========================= */

function advanceQuestion(){

  currentA=currentB;

  currentB=nextNumbers.shift();

  nextNumbers.push(randomAddend());

  currentAnswer=(currentA+currentB)%10;

  renderQuestion(true);
  renderNext(true);

}

    p.className="particle";

    p.style.top=(50+Math.random()*10-5)+"%";

    p.style.setProperty(

    );

    );

  const messages={

    100:"👑 100 CORRECT! 👑"

/* =========================
   ANSWER
========================= */

function answer(n){

  if(!playing)return;

  if(n===currentAnswer){

    correctCount++;

    combo++;

    if(combo>bestCombo){

      bestCombo=combo;

      save("neuroKreppelinBest",bestCombo);

    }

    score+=
      10+
      (combo>=5 ? Math.min(combo,20):0);

    soundCorrect();

    if(combo>=3){
      soundCombo();
    }

    if(
      [30,50,80,100].includes(correctCount)
    ){
      milestone(correctCount);
    }

    advanceQuestion();

    updateUI();

  }else{

    /*
      ★重要
      ハズレでは問題を進めない
    */

    missCount++;

    combo=0;

    soundMiss();

    updateUI();

    document.body.classList.remove("hit");

    void document.body.offsetWidth;

    document.body.classList.add("hit");

  }

}

function startGame(){

  getAudio();

  playing=true;

  score=0;
  correctCount=0;
  missCount=0;
  combo=0;

  $("resultOverlay").classList.add("hidden");

  $("startButton").textContent="PLAYING...";

  createQuestion();

  endAt=
    Date.now()+
    selectedTime*1000;

  clearInterval(timerId);

  timerId=setInterval(()=>{

    const remaining=
      Math.max(0,endAt-Date.now());

    const ratio=
      remaining/(selectedTime*1000);

    $("timerBar").style.width=
      (ratio*100)+"%";

    updateUI();

    if(remaining<=0){

      endGame();

    }

  },50);

  updateUI();

}

   END
========================= */

function endGame(){

  if(!playing)return;

  playing=false;

  clearInterval(timerId);

  $("startButton").textContent="START GAME";

  const earned=score;

  totalPoints+=earned;

  save("neuroKreppelinPoints",totalPoints);

  updatePoints();

  const attempts=
    correctCount+missCount;

  const accuracy=
    attempts
      ? Math.round(correctCount/attempts*100)
      : 0;

  let title="RESULT";

  if(bestCombo>=20){
    title="🔥 LEGENDARY!!! 🔥";
  }else if(bestCombo>=15){
    title="⚡ AMAZING!! ⚡";
  }else if(correctCount>=30){
    title="🌈 GREAT!! 🌈";
  }else if(correctCount>=20 && missCount<=5){
    title="✨ NICE PLAY! ✨";
  }else if(missCount<=3){
    title="🎯 ACCURATE!";
  }

  $("resultTitle").textContent=title;
  $("resultScore").textContent=score;
  $("resultCorrect").textContent=correctCount;
  $("resultMiss").textContent=missCount;
  $("resultBest").textContent=bestCombo;
  $("resultAccuracy").textContent=accuracy+"%";
  $("resultPoints").textContent=earned;

  $("resultOverlay").classList.remove("hidden");

  particles(45);

  setTimeout(()=>{

    document
      .querySelectorAll(".particle")
      .forEach(p=>p.remove());

  },3000);

}

function NG_totalOwned(){

  return Object.keys(NG_owned).filter(id => NG_owned[id]).length;
}


/* =========================

   ========================= */

function NG_rates(){

  if(!NG_baseComplete()){

    return [
      ["NORMAL",50],
      ["RARE",30],
      ["EPIC",12],
      ["LEGEND",5],
      ["SECRET",2],
      ["快楽",1]
    ];

  }

  /* 解放後 */

  return [
    ["NORMAL",40],
    ["RARE",30],
    ["EPIC",16],
    ["LEGEND",7],
    ["SECRET",4],
    ["快楽",0.95],
    ["月村手毬",2],
    ["???",0.05]
  ];
}


/* =========================
   RARITY VALUE
   ========================= */

function NG_rarityValue(r){

  const values = {
    "NORMAL":1,
    "RARE":2,
    "EPIC":3,
    "LEGEND":4,
    "SECRET":5,
    "快楽":6,
    "月村手毬":7,
    "???":8
  };

  return values[r] || 0;
}


/* =========================
   RANDOM RARITY
   ========================= */

function NG_randomRarity(forceLegend=false){

  let rates = NG_rates();

  if(forceLegend){

    rates = rates.filter(x =>
      NG_rarityValue(x[0]) >= NG_rarityValue("LEGEND")
    );

  }

  let total = rates.reduce((a,b)=>a+b[1],0);

  let r = Math.random() * total;

  for(const [rarity,rate] of rates){

    r -= rate;

    if(r <= 0){
      return rarity;
    }

  }

  return rates[rates.length-1][0];
}

function NG_pickItem(rarity){

  if(rarity === "月村手毬"){

    return {

      icon:"🟪",
      name:"月村手毬",

      quote:
        NG_TEMARI_QUOTES[
          Math.floor(Math.random()*NG_TEMARI_QUOTES.length)
        ]
    };

  }

  if(rarity === "???"){

    return {
      id:"job",
      rarity:"???",
      icon:"💼",
      name:"内定",
      source:"SECRET",
      effect:"専用内定演出"
    };

  }

  const pool =
    NG_GACHA_ITEMS.filter(x => x.rarity === rarity);

  return pool[Math.floor(Math.random()*pool.length)];
}

      name:"月村手毬",
      source:"10種類のセリフ",
      effect:"セリフコレクション"
    });

    list.push({
      id:"job",
      rarity:"???",
      icon:"💼",
      name:"内定",
      source:"SPECIAL",
      effect:"専用内定演出"
    });

  }

  list.sort((a, b) => {
  return rarityOrder.indexOf(a.rarity) - rarityOrder.indexOf(b.rarity);
});
  
  for(const item of list){

    const owned =
      !!NG_owned[item.id];

    const card =
      document.createElement("div");

    card.className =
      "ng-card" +
      (owned ? "" : " locked");

    let displayName =
      owned ? item.name : "？？？？";

    let icon =
      owned ? item.icon : "❔";

    let effect =
      owned ? item.effect : "未獲得";

    let quote = "";

    if(item.id === "temari" && owned){

      quote =
        `<div class="ng-temari-quote">
          所持セリフ：${NG_owned.temariQuotes
            ? NG_owned.temariQuotes.length
            : 0}/10
        </div>`;

    }

    card.innerHTML = `

      <div class="ng-card-icon">
        ${icon}
      </div>

      <div class="ng-card-rarity">
        ${item.rarity}
      </div>

      <div class="ng-card-name">
        ${displayName}
      </div>

      <div class="ng-card-effect">
        ${effect}
      </div>

      ${quote}

      ${
        owned
        ?
        `<button class="ng-equip ${
          NG_equip === item.id ? "equipped" : ""
        }"
        data-ng-equip="${item.id}">
          ${
            NG_equip === item.id
            ? "✓ 装備中"
            : "装備"
          }
        </button>`
        :
        `<button class="ng-equip" disabled>
          🔒 未獲得
        </button>`
      }

    `;

    grid.appendChild(card);

  }

  grid.querySelectorAll("[data-ng-equip]")
    .forEach(btn => {

      btn.addEventListener("click",()=>{

        NG_equip =
          btn.dataset.ngEquip;

        NG_save();

        NG_renderCollection();

        NG_applyEquip();

      });

    });

}


/* =========================
   TEMARI COLLECTION
   ========================= */

function NG_ensureTemariStorage(){

  if(!Array.isArray(NG_owned.temariQuotes)){

    NG_owned.temariQuotes = [];

  }

}


/* =========================
   EQUIP EFFECT
   ========================= */

function NG_applyEquip(){

  document.body.classList.remove(
    "ng-equip-normal",
    "ng-equip-rare",
    "ng-equip-epic",
    "ng-equip-legend",
    "ng-equip-secret",
    "ng-equip-pleasure",
    "ng-equip-temari",
    "ng-equip-job"
  );

  if(!NG_equip) return;

  let item = null;

  if(NG_equip === "temari"){

    document.body.classList.add("ng-equip-temari");
    return;

  }

  if(NG_equip === "job"){

    document.body.classList.add("ng-equip-job");
    return;

  }

  item =
    NG_GACHA_ITEMS.find(
      x => x.id === NG_equip
    );

  if(item){

    document.body.classList.add(
      "ng-equip-" +
      item.rarity.toLowerCase()
    );

  }

}


/* =========================
   EQUIP GAME EFFECT
   ========================= */

function NG_triggerEquipEffect(){

  if(!NG_equip) return;

  const item =
    NG_GACHA_ITEMS.find(
      x => x.id === NG_equip
    );

  if(NG_equip === "temari"){

    NG_ensureTemariStorage();

    if(NG_owned.temariQuotes.length){

      const q =
        NG_owned.temariQuotes[
          Math.floor(
            Math.random() *
            NG_owned.temariQuotes.length
          )
        ];

      NG_showToast("🟪 月村手毬",q);

    }

    return;
  }

  if(NG_equip === "job"){

    NG_particles(20);
    return;

  }

  if(item){

    const amount = {
      NORMAL:4,
      RARE:7,
      EPIC:10,
      LEGEND:14,
      SECRET:20,
      快楽:25
    }[item.rarity] || 5;

    NG_particles(amount);

  }

}


/* =========================
   PARTICLES
   ========================= */

function NG_particles(amount){

  if(typeof particles === "function"){

    try{
      particles(amount);
      return;
    }catch(e){}

  }

  for(let i=0;i<Math.min(amount,30);i++){

    const p =
      document.createElement("div");

    p.textContent = "✦";

    p.style.position = "fixed";
    p.style.left = Math.random()*100 + "%";
    p.style.top = Math.random()*100 + "%";
    p.style.zIndex = "10000";
    p.style.pointerEvents = "none";
    p.style.fontSize = "22px";
    p.style.color =
      `hsl(${Math.random()*360},100%,70%)`;
    p.style.animation =
      "ngPop .5s ease forwards";

    document.body.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },600);

  }

}


/* =========================
   TOAST
   ========================= */

function NG_showToast(title,text){

  const box =
    document.createElement("div");

  box.style.position = "fixed";
  box.style.left = "50%";
  box.style.top = "20%";
  box.style.transform = "translateX(-50%)";
  box.style.zIndex = "10001";
  box.style.maxWidth = "90%";
  box.style.padding = "16px 22px";
  box.style.borderRadius = "18px";
  box.style.background = "rgba(20,20,45,.95)";
  box.style.color = "#fff";
  box.style.textAlign = "center";
  box.style.fontWeight = "900";
  box.style.boxShadow = "0 0 35px rgba(160,100,255,.7)";

  box.innerHTML =
    `<div style="font-size:13px;opacity:.7">${title}</div>
     <div style="font-size:18px;margin-top:5px">${text}</div>`;

  document.body.appendChild(box);

  setTimeout(()=>{
    box.remove();
  },1800);

}

/* =========================
   GACHA DRAW
   ========================= */

let NG_busy = false;

async function NG_draw(ten=false){

  if(NG_busy) return;

  if(ten && !NG_baseComplete()){

    NG_showToast(
      "🔒 LOCKED",
      "初期図鑑を完成させると10連が解放されます"
    );

    return;

  }

  const base =
    ten ? 900 : 100;

  const price =
    NG_gachaPrice(base);

  if(NG_getPoints() < price){

    NG_showToast(
      "POINT不足",
      `${price}P必要です`
    );

    return;

  }

  NG_busy = true;

  NG_setPoints(
    NG_getPoints() - price
  );

  const results = [];

  for(let i=0;i<(ten?10:1);i++){

    const forceLegend =
      ten && i === 9;

    const rarity =
      NG_randomRarity(forceLegend);

    const result =
      NG_pickItem(rarity);

    results.push(result);

  }


  let duplicateBonus = 0;

  for(const result of results){

    NG_count++;

    if(result.id === "temari"){

      NG_ensureTemariStorage();

      const quote =
        result.quote;

      NG_lastTemariQuote =
        quote;

      if(
        !NG_owned.temariQuotes
          .includes(quote)
      ){

        NG_owned.temariQuotes.push(
          quote
        );

        NG_owned.temari = true;

      }else{

        duplicateBonus +=
          NG_duplicatePoint("月村手毬");

      }

      continue;

    }


    if(result.id === "job"){

      if(!NG_owned.job){

        NG_owned.job = true;

      }else{

        duplicateBonus +=
          NG_duplicatePoint("???");

      }

      continue;

    }


    if(NG_owned[result.id]){

      duplicateBonus +=
        NG_duplicatePoint(result.rarity);

    }else{

      NG_owned[result.id] = true;

    }

  }


  if(duplicateBonus > 0){

    NG_setPoints(
      NG_getPoints() + duplicateBonus
    );

  }


  NG_save();

  NG_updateGachaUI();

  NG_renderCollection();


  const resultBox =
    document.getElementById("ngGachaResult");

  if(resultBox){

    resultBox.innerHTML = "";

  }


  for(const result of results){

    NG_reveal(result);

    NG_particles(
      result.rarity === "SECRET" ||
      result.rarity === "LEGEND" ||
      result.rarity === "月村手毬" ||
      result.rarity === "???"
      ? 18
      : 6
    );

    await new Promise(
      resolve => setTimeout(
        resolve,
        ten ? 180 : 700
      )
    );

  }


  if(duplicateBonus > 0){

    const resultBox =
      document.getElementById("ngGachaResult");

    if(resultBox){

      resultBox.innerHTML += `
        <div class="ng-result">
          🔁 重複ボーナス
          <b>+${duplicateBonus}P</b>
        </div>
      `;

    }

  }


  if(results.some(x=>x.id==="job")){

    setTimeout(
      NG_showJobOffer,
      300
    );

  }


  NG_busy = false;

  NG_save();

  NG_updateGachaUI();

  NG_renderCollection();

}


/* =========================
   DISCOUNT SHOP
   ========================= */

function NG_renderDiscountShop(){

  const shopOverlay =
    document.getElementById("shopOverlay");

  if(!shopOverlay) return;

  let old =
    document.getElementById("ngDiscountShop");

  if(old) old.remove();

  const box =
    document.createElement("div");

  box.id = "ngDiscountShop";

  box.className = "ng-discount";

  let html =
    `<h3 style="margin-top:0">
      🎟️ ガチャ割引券
    </h3>
    <div style="font-size:12px;opacity:.7;margin-bottom:8px">
      ガチャ累計回数でショップに追加されます
    </div>`;

  for(const d of NG_DISCOUNTS){

    const unlocked =
      NG_count >= d.draws;

    const claimed =
      !!NG_claimedDiscounts[d.percent];

    let button = "";

    if(claimed){

      button =
        `<button class="ng-claim" disabled>
          ✓ 取得済み
        </button>`;

    }else if(unlocked){

      button =
        `<button class="ng-claim"
          data-ng-claim="${d.percent}">
          無料で受け取る
        </button>`;

    }else{

      button =
        `<button class="ng-claim" disabled>
          ${d.draws}回
        </button>`;

    }

    html += `
      <div class="ng-discount-row">
        <div>
          🎟️ ${d.percent}%OFF券<br>
          <small>
            ${d.draws}回突破
          </small>
        </div>
        ${button}
      </div>
    `;

  }

  html += `
    <div style="
      margin-top:10px;
      text-align:center;
      font-weight:1000;
    ">
      現在のガチャ割引：${NG_discount}%
    </div>
  `;

  box.innerHTML = html;

  const panel =
    shopOverlay.querySelector(".shop");

  if(panel){

    panel.appendChild(box);

  }else{

    shopOverlay.appendChild(box);

  }


  box.querySelectorAll("[data-ng-claim]")
    .forEach(btn=>{

      btn.addEventListener("click",()=>{

        const percent =
          Number(btn.dataset.ngClaim);

        NG_claimedDiscounts[percent] = true;

        NG_discount =
          Math.max(
            NG_discount,
            percent
          );

        /*
         * 上位券を取得した場合、
         * 下位券も取得済みにする
         */
        for(const d of NG_DISCOUNTS){

          if(d.percent <= percent &&
             NG_count >= d.draws){

            NG_claimedDiscounts[
              d.percent
            ] = true;

          }

        }

        NG_save();

        NG_renderDiscountShop();

        NG_updateGachaUI();

      });

    });

}

      typeof correctCount === "number"
      ? correctCount
      : 0;

    NG_originalAnswer(n);
