<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEURO KREPELIN</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  text-align:center;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#080a14,#15102b,#071923,#190b20);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
  overflow-x:hidden;
}

@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

header{
  padding:20px 10px 8px;
}

h1{
  margin:0;
  font-size:31px;
  letter-spacing:4px;
  font-weight:1000;
  background:linear-gradient(
    90deg,
    #00eaff,
    #ff4fd8,
    #ffe600,
    #00ff9d
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  background-size:300% 100%;
  animation:rainbow 4s linear infinite;
}

@keyframes rainbow{
  to{
    background-position:300% 0;
  }
}

.subtitle{
  color:#aeb5cc;
  font-size:13px;
  margin-top:3px;
}

#topControls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 10px;
}

button{
  cursor:pointer;
}

.timeButton,
.startButton,
.shopButton{
  border:0;
  border-radius:15px;
  padding:11px 18px;
  color:#fff;
  font-weight:1000;
  transition:.15s;
  box-shadow:0 8px 25px #0004;
}

.timeButton{
  background:#20263b;
}

.timeButton.active{
  background:linear-gradient(135deg,#00cfff,#7b2cff);
  box-shadow:0 0 24px #7b2cff77;
}

.startButton{
  background:linear-gradient(135deg,#ff008c,#7b2cff);
  font-size:16px;
}

.shopButton{
  background:linear-gradient(135deg,#ffb300,#ff4f81);
}

button:active{
  transform:scale(.94);
}

#pointsTop{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#141827;
  border:1px solid #ffffff18;
  border-radius:14px;
  padding:9px 14px;
  font-weight:1000;
  color:#ffd84d;
}

#stats{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:10px auto;
}

.stat{
  background:#141827dd;
  border-radius:13px;
  padding:7px 13px;
  min-width:78px;
  border:1px solid #ffffff0d;
}

.stat small{
  display:block;
  color:#8991a8;
  font-size:10px;
}

.stat strong{
  font-size:19px;
}

#timerBar{
  width:min(760px,90%);
  height:8px;
  margin:10px auto;
  background:#202437;
  border-radius:10px;
  overflow:hidden;
}

#timer{
  width:100%;
  height:100%;
  background:linear-gradient(
    90deg,
    #00eaff,
    #ff3dbb,
    #ffe600
  );
  transition:width .1s linear;
}

#game{
  max-width:1000px;
  margin:auto;
  padding:5px 14px 25px;
  position:relative;
}

#scoreLine{
  font-weight:1000;
  font-size:18px;
  color:#ffd84d;
  margin:5px;
}

#combo{
  min-height:45px;
  font-size:27px;
  font-weight:1000;
  transition:transform .12s;
  text-shadow:0 0 15px #fff5;
}

#streakMsg{
  height:30px;
  font-size:18px;
  font-weight:1000;
  opacity:0;
  transition:.15s;
}

#streakMsg.show{
  opacity:1;
  transform:scale(1.15);
}

/* =========================
   QUESTION
========================= */

#questionArea{
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin:5px auto 0;
  max-width:850px;
}

#question{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-size:72px;
  font-weight:1000;
  line-height:1;
  white-space:nowrap;
  text-shadow:0 0 20px #ffffff22;
}

.qpart{
  display:inline-block;
}

#qOperator{
  display:inline-block;
}

.joinIn{
  animation:joinIn .35s cubic-bezier(.2,.9,.2,1);
}

@keyframes joinIn{
  from{
    transform:translateX(90px);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

/* =========================
   NEXT
========================= */

#nextPanel{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

#nextPanel label{
  font-size:12px;
  font-weight:1000;
  letter-spacing:3px;
  color:#9ba3bd;
}

#nextNumbers{
  display:flex;
  gap:8px;
  overflow:hidden;
}

.nextNumber{
  width:66px;
  height:66px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:1000;
  color:#fff;
  background:linear-gradient(
    135deg,
    #00cfff,
    #7b2cff
  );
  box-shadow:0 0 25px #00cfff44;
}

.nextNumber.slide{
  animation:nextSlide .35s ease;
}

@keyframes nextSlide{
  from{
    transform:translateX(80px);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

/* =========================
   KEYPAD
========================= */

#keypad{
  width:min(310px,92vw);
  margin:10px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.key{
  border:0;
  border-radius:20px;
  min-height:67px;
  color:#fff;
  font-size:28px;
  font-weight:1000;
  background:linear-gradient(135deg,#1c2440,#2b1b4e);
  box-shadow:
    inset 0 1px 0 #ffffff18,
    0 8px 20px #0005;
}

.key:nth-child(1),
.key:nth-child(4),
.key:nth-child(7){
  background:linear-gradient(135deg,#00aeea,#3158ff);
}

.key:nth-child(2),
.key:nth-child(5),
.key:nth-child(8){
  background:linear-gradient(135deg,#7b2cff,#d92cff);
}

.key:nth-child(3),
.key:nth-child(6),
.key:nth-child(9){
  background:linear-gradient(135deg,#ff008c,#ff5b3d);
}

.key:nth-child(10){
  grid-column:2;
  background:linear-gradient(135deg,#ffb300,#ff4f81);
}

#message{
  color:#aeb5cc;
  font-size:13px;
  margin:12px;
}

/* =========================
   FLASH
========================= */

#flash{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:0;
  z-index:20;
}

body.hit #flash{
  background:#fff;
  animation:flash .12s ease-out;
}

@keyframes flash{
  0%{opacity:.18}
  100%{opacity:0}
}

/* =========================
   FEVER
========================= */

#feverOverlay{
  display:none;
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:12;
  overflow:hidden;
}

#feverText{
  position:absolute;
  left:50%;
  top:25%;
  transform:translateX(-50%);
  font-size:clamp(34px,8vw,75px);
  font-weight:1000;
  letter-spacing:4px;
  color:#fff;
  text-shadow:
    0 0 15px #00eaff,
    0 0 40px #ff00c8;
  animation:feverPulse .4s infinite alternate;
}

@keyframes feverPulse{
  from{
    transform:translateX(-50%) scale(1);
  }
  to{
    transform:translateX(-50%) scale(1.12);
  }
}

.fParticle{
  position:absolute;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 15px #fff;
  animation:particle 1s linear forwards;
}

@keyframes particle{
  from{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  to{
    transform:
      translate(var(--x),var(--y))
      scale(.1);
    opacity:0;
  }
}

/* =========================
   RESULT
========================= */

#resultOverlay,
#shopOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  background:#05060dcc;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(520px,94vw);
  background:linear-gradient(
    145deg,
    #141827,
    #21153c
  );
  border:1px solid #ffffff18;
  border-radius:26px;
  padding:26px;
  box-shadow:0 20px 80px #000b;
}

.resultTitle{
  font-size:28px;
  font-weight:1000;
  margin-bottom:12px;
}

.resultBig{
  font-size:50px;
  font-weight:1000;
  color:#ffd84d;
  text-shadow:0 0 25px #ffd84d55;
}

.resultStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:18px 0;
}

.resultStat{
  background:#0d1020;
  border-radius:14px;
  padding:10px;
}

.resultStat small{
  display:block;
  color:#8991a8;
}

.resultStat strong{
  font-size:22px;
}

.resultPoints{
  font-size:21px;
  font-weight:1000;
  color:#7dffcb;
  margin:12px;
}

.resultButtons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.resultButtons button{
  border:0;
  border-radius:16px;
  padding:13px 22px;
  color:#fff;
  font-weight:1000;
  font-size:16px;
}

.restartButton{
  background:linear-gradient(135deg,#00cfff,#7b2cff);
}

.titleButton{
  background:linear-gradient(135deg,#ff008c,#7b2cff);
}

.resultBurst{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.rParticle{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  animation:rBurst 1.5s ease-out forwards;
}

@keyframes rBurst{
  from{
    left:50%;
    top:45%;
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  to{
    left:var(--lx);
    top:var(--ly);
    transform:scale(.1);
    opacity:0;
  }
}

/* =========================
   SHOP
========================= */

#shopOverlay .card{
  max-height:88vh;
  overflow:auto;
}

.shopHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.shopHead h2{
  margin:0;
  font-size:25px;
}

.shopPoints{
  color:#ffd84d;
  font-weight:1000;
}

.shopGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.item{
  background:#0e1222;
  border:1px solid #ffffff12;
  border-radius:17px;
  padding:14px;
  text-align:left;
}

.item h3{
  margin:0 0 5px;
  font-size:17px;
}

.item p{
  margin:0 0 9px;
  color:#9da5bd;
  font-size:12px;
  line-height:1.4;
}

.buy{
  width:100%;
  margin:0;
  padding:9px;
  border:0;
  border-radius:12px;
  background:#5865f2;
  color:#fff;
  font-weight:1000;
}

.buy.owned{
  background:#254b3c;
  color:#7dffcb;
}

.closeShop{
  background:#272d42;
  border:0;
  color:#fff;
  border-radius:13px;
  padding:10px 18px;
  font-weight:1000;
  margin-top:15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:720px){

  #nextPanel{
    position:relative;
    right:auto;
    top:auto;
    transform:none;
    margin:2px auto 10px;
  }

  #questionArea{
    min-height:125px;
  }

  #question{
    font-size:54px;
  }

  .nextNumber{
    width:58px;
    height:58px;
    font-size:30px;
  }
}

@media(max-width:480px){

  #question{
    font-size:47px;
  }

  .key{
    min-height:61px;
  }

  .shopGrid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>NEURO KREPELIN</h1>
  <div class="subtitle">反射 × 計算 × コンボ</div>
</header>

<div id="topControls">

  <button class="timeButton active" data-time="30">
    30 SEC
  </button>

  <button class="timeButton" data-time="60">
    60 SEC
  </button>

  <button class="startButton" id="startButton">
    START GAME
  </button>

  <button class="shopButton" id="shopButton">
    🛒 SHOP
  </button>

  <div id="pointsTop">
    💰 <span id="pointsText">0</span>P
  </div>

</div>

<div id="stats">

  <div class="stat">
    <small>TIME</small>
    <strong id="timeText">30</strong>
  </div>

  <div class="stat">
    <small>正解</small>
    <strong id="correctText">0</strong>
  </div>

  <div class="stat">
    <small>ミス</small>
    <strong id="wrongText">0</strong>
  </div>

  <div class="stat">
    <small>BEST COMBO</small>
    <strong id="bestText">0</strong>
  </div>

</div>

<div id="timerBar">
  <div id="timer"></div>
</div>

<div id="game">

  <div id="scoreLine">
    SCORE <span id="scoreText">0</span>
  </div>

  <div id="combo">
    COMBO 0
  </div>

  <div id="streakMsg"></div>

  <div id="questionArea">

    <div id="question">

      <span id="questionA" class="qpart">
        READY?
      </span>

      <span id="qOperator"></span>

      <span id="questionB" class="qpart"></span>

    </div>

    <div id="nextPanel">

      <label>NEXT</label>

      <div id="nextNumbers">

        <div class="nextNumber" id="nextNumber1">
          -
        </div>

        <div class="nextNumber" id="nextNumber2">
          -
        </div>

      </div>

    </div>

  </div>

  <div id="keypad">

    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>

    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>

    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>

    <button class="key" data-key="0">0</button>

  </div>

  <div id="message">
    答えは1の位だけをタップ！
  </div>

</div>

<div id="flash"></div>

<div id="feverOverlay">
  <div id="feverText">
    FEVER!!
  </div>
</div>

<!-- =========================
     RESULT
========================= -->

<div id="resultOverlay">

  <div class="card" id="resultCard">

    <div class="resultBurst" id="resultBurst"></div>

    <div class="resultTitle" id="resultTitle">
      RESULT
    </div>

    <div class="resultBig">
      <span id="resultScore">0</span>
      SCORE
    </div>

    <div class="resultStats">

      <div class="resultStat">
        <small>正解</small>
        <strong id="resultCorrect">0</strong>
      </div>

      <div class="resultStat">
        <small>ミス</small>
        <strong id="resultWrong">0</strong>
      </div>

      <div class="resultStat">
        <small>BEST COMBO</small>
        <strong id="resultCombo">0</strong>
      </div>

      <div class="resultStat">
        <small>正答率</small>
        <strong id="resultRate">0%</strong>
      </div>

    </div>

    <div class="resultPoints">
      💰 +<span id="earnedPoints">0</span>P
    </div>

    <div class="resultButtons">

      <button
        class="restartButton"
        id="restartButton">
        🔄 やり直す
      </button>

      <button
        class="titleButton"
        id="titleButton">
        🏠 タイトルへ
      </button>

    </div>

  </div>

</div>

<!-- =========================
     SHOP
========================= -->

<div id="shopOverlay">

  <div class="card">

    <div class="shopHead">

      <h2>🛒 POINT SHOP</h2>

      <div class="shopPoints">
        💰 <span id="shopPoints">0</span>P
      </div>

    </div>

    <div
      class="shopGrid"
      id="shopGrid">
    </div>

    <button
      class="closeShop"
      id="closeShop">
      閉じる
    </button>

  </div>

</div>

<script>

/* =========================
   VARIABLES
========================= */

let selectedTime=30;
let timeLeft=30;
let timer=null;
let playing=false;

let correctCount=0;
let missCount=0;
let combo=0;

let bestCombo=
  Number(
    localStorage.getItem(
      "neuroKreppelinBest"
    ) || 0
  );

let score=0;

let totalPoints=
  Number(
    localStorage.getItem(
      "neuroKreppelinPoints"
    ) || 0
  );

let currentA=0;
let currentB=0;
let currentAnswer=0;

let nextNumbers=[];

let feverTimer=null;
let resultTimer=null;

let audioCtx=null;

/* =========================
   DOM
========================= */

const $=id=>
  document.getElementById(id);

/* =========================
   SHOP ITEMS
========================= */

const shopItems=[

  {
    id:"theme_neon",
    name:"🌈 NEONテーマ",
    desc:"ゲーム中のネオン演出を強化。",
    price:100
  },

  {
    id:"theme_rainbow",
    name:"✨ RAINBOWテーマ",
    desc:"タイトルと演出がレインボー仕様に。",
    price:250
  },

  {
    id:"effect_cosmic",
    name:"🌌 COSMIC演出",
    desc:"30/50/80/100正解の演出を変更。",
    price:400
  },

  {
    id:"effect_fire",
    name:"🔥 FIRE演出",
    desc:"ピカピカ演出を炎系に変更。",
    price:600
  },

  {
    id:"title_calc",
    name:"👑 計算神",
    desc:"称号「計算神」を解放。",
    price:500
  },

  {
    id:"title_reflex",
    name:"⚡ 反射神経MAX",
    desc:"称号「反射神経MAX」を解放。",
    price:800
  },

  {
    id:"title_neuro",
    name:"🧠 NEURO MASTER",
    desc:"特別称号を解放。",
    price:1500
  }

];

/* =========================
   POINT
========================= */

function updatePoints(){

  $("pointsText").textContent=
    totalPoints.toLocaleString();

  $("shopPoints").textContent=
    totalPoints.toLocaleString();

}

function savePoints(){

  localStorage.setItem(
    "neuroKreppelinPoints",
    String(totalPoints)
  );

  updatePoints();

}

function owned(id){

  return localStorage.getItem(
    "neuroKreppelinOwned_"+id
  )==="1";

}

/* =========================
   SHOP
========================= */

function buyItem(id){

  const item=
    shopItems.find(
      x=>x.id===id
    );

  if(!item)return;

  if(owned(id))return;

  if(totalPoints<item.price){

    soundMiss();

    return;

  }

  totalPoints-=item.price;

  localStorage.setItem(
    "neuroKreppelinOwned_"+id,
    "1"
  );

  savePoints();

  renderShop();

  tone(
    1000,
    .07,
    "sine",
    .025
  );

}

function renderShop(){

  updatePoints();

  $("shopGrid").innerHTML=
    shopItems.map(item=>{

      const has=
        owned(item.id);

      return `

        <div class="item">

          <h3>${item.name}</h3>

          <p>${item.desc}</p>

          <button
            class="buy ${has?"owned":""}"
            data-buy="${item.id}">

            ${
              has
              ?"✓ 購入済み"
              :item.price.toLocaleString()+"P で購入"
            }

          </button>

        </div>

      `;

    }).join("");

  document
    .querySelectorAll("[data-buy]")
    .forEach(button=>{

      button.onclick=()=>
        buyItem(
          button.dataset.buy
        );

    });

}

$("shopButton").onclick=()=>{

  renderShop();

  $("shopOverlay").style.display=
    "flex";

};

$("closeShop").onclick=()=>{

  $("shopOverlay").style.display=
    "none";

};

/* =========================
   TIME
========================= */

document
  .querySelectorAll(".timeButton")
  .forEach(button=>{

    button.onclick=()=>{

      if(playing)return;

      document
        .querySelectorAll(".timeButton")
        .forEach(x=>
          x.classList.remove("active")
        );

      button.classList.add("active");

      selectedTime=
        Number(button.dataset.time);

      timeLeft=
        selectedTime;

      $("timeText").textContent=
        selectedTime;

      $("timer").style.width=
        "100%";

    };

  });

/* =========================
   AUDIO
========================= */

function initAudio(){

  try{

    audioCtx ||=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(
      audioCtx.state===
      "suspended"
    ){

      audioCtx.resume();

    }

  }catch(e){}

}

function tone(
  freq,
  duration=.06,
  type="sine",
  gain=.035,
  delay=0
){

  try{

    initAudio();

    const oscillator=
      audioCtx.createOscillator();

    const gainNode=
      audioCtx.createGain();

    oscillator.type=
      type;

    oscillator.frequency.value=
      freq;

    oscillator.connect(
      gainNode
    );

    gainNode.connect(
      audioCtx.destination
    );

    const startTime=
      audioCtx.currentTime+
      delay;

    gainNode.gain.setValueAtTime(
      gain,
      startTime
    );

    gainNode.gain
      .exponentialRampToValueAtTime(
        .001,
        startTime+duration
      );

    oscillator.start(
      startTime
    );

    oscillator.stop(
      startTime+duration
    );

  }catch(e){}

}

/* 静かめの正解SE */

function soundCorrect(){

  tone(
    760,
    .055,
    "sine",
    .025
  );

}

/* ミス */

function soundMiss(){

  tone(
    180,
    .11,
    "square",
    .025
  );

}

/* コンボ */

function soundCombo(){

  tone(
    850,
    .05,
    "sine",
    .03
  );

  tone(
    1100,
    .07,
    "sine",
    .025,
    .055
  );

}

function soundMilestone(){

    .035
  );

  tone(
    880,
    .09,
    "triangle",
    .035,
    .09
  );

  tone(
    1320,
    .14,
    "triangle",
    .035,
    .18
  );

}

/* 結果 */

function soundResult(){

    .08,
    "triangle",
    .035
  );

  tone(
    780,
    .09,

    .035,
    .09

/* =========================
   NUMBER
========================= */

function randomAddend(){

  return Math.floor(
    Math.random()*8
  )+2;

}

/* =========================
   FIRST QUESTION
========================= */

function createFirstQuestion(){

  currentA=
    randomAddend();

  currentB=
    randomAddend();

  currentAnswer=
    (currentA+currentB)%10;

  nextNumbers=[
    randomAddend(),
    randomAddend()
  ];

  renderQuestion(false);
  renderNext(false);

}

/* =========================
   QUESTION
========================= */

function renderQuestion(
  animate=true
){

  $("questionA").textContent=
    currentA;

  $("qOperator").textContent=
    "+";

  $("questionB").textContent=
    currentB;

  if(animate){

    $("qOperator")
      .classList.remove(
        "joinIn"
      );

    $("questionB")
      .classList.remove(
        "joinIn"
      );

    void $("questionB")
      .offsetWidth;

    $("qOperator")
      .classList.add(
        "joinIn"
      );

    $("questionB")
      .classList.add(
        "joinIn"
      );

  }

}

/* =========================
   NEXT
========================= */

function renderNext(
  animate=true
){

  $("nextNumber1").textContent=
    nextNumbers[0] ?? "-";

  $("nextNumber2").textContent=
    nextNumbers[1] ?? "-";

  if(animate){

    $("nextNumber1")
      .classList.remove(
        "slide"
      );

    $("nextNumber2")
      .classList.remove(
        "slide"
      );

    void $("nextNumber1")
      .offsetWidth;

    $("nextNumber1")
      .classList.add(
        "slide"
      );

    $("nextNumber2")
      .classList.add(
        "slide"
      );

  }

}

/* =========================
   ADVANCE
========================= */

function advanceQuestion(){

  /*
    7 + 2

    ↓

    2 + 8

    「2」はそのまま次のAになる
  */

  currentA=
    currentB;

  currentB=
    nextNumbers.shift();

  nextNumbers.push(
    randomAddend()
  );

  currentAnswer=
    (currentA+currentB)%10;

  renderQuestion(true);
  renderNext(true);

}

/* =========================
   COMBO
========================= */

function updateCombo(){

  $("combo").textContent=
    "COMBO "+combo;

  $("combo").style.transform=
    "scale(1.12)";

  setTimeout(()=>{

    $("combo").style.transform=
      "scale(1)";

  },120);

  if(combo>bestCombo){

    bestCombo=
      combo;

    localStorage.setItem(
      "neuroKreppelinBest",
      String(bestCombo)
    );

    $("bestText").textContent=
      bestCombo;

  }

  if(
    combo>=5 &&
    combo%5===0
  ){

    soundCombo();

  }

}

/* =========================
   FLASH
========================= */

function hitFlash(){

  document.body
    .classList
    .remove("hit");

  void document.body
    .offsetWidth;

  document.body
    .classList
    .add("hit");

}

/* =========================
   FEVER PARTICLES
========================= */

function createFeverParticles(){

  $("feverOverlay")
    .querySelectorAll(
      ".fParticle"
    )
    .forEach(x=>x.remove());

  for(
    let i=0;
    i<45;
    i++
  ){

    const p=
      document.createElement(
        "div"
      );

    p.className=
      "fParticle";

    p.style.left=
      "50%";

    p.style.top=
      "35%";

    p.style.setProperty(
      "--x",
      (Math.random()*1000-500)
      +"px"
    );

    p.style.setProperty(
      "--y",
      (Math.random()*700-350)
      +"px"
    );

    p.style.animationDelay=
      (Math.random()*.15)
      +"s";

    $("feverOverlay")
      .appendChild(p);

  }

}

/* =========================
   FEVER
========================= */

function showFever(
  text,
  duration=3000
){

  clearTimeout(
    feverTimer
  );

  $("feverText")
    .textContent=text;

  $("feverOverlay")
    .style.display=
      "block";

  createFeverParticles();

  feverTimer=
    setTimeout(
      stopFever,
      duration
    );

}

function stopFever(){

  clearTimeout(
    feverTimer
  );

  feverTimer=null;

  $("feverOverlay")
    .style.display=
      "none";

  $("feverOverlay")
    .querySelectorAll(
      ".fParticle"
    )
    .forEach(x=>x.remove());

}

/* =========================
   MILESTONE
========================= */

function milestone(n){

  const messages={

    30:"🔥 30 CORRECT! 🔥",

    50:"⚡ 50 CORRECT! ⚡",

    80:"🌈 80 CORRECT! 🌈",

    100:"👑 100 CORRECT! 👑"

  };

  const bonus={

    30:100,

    50:200,

    80:400,

    100:800

  };

  if(!messages[n])return;

  totalPoints+=
    bonus[n];

  savePoints();

  soundMilestone();

  /*
    ピカピカは必ず3秒
  */

  showFever(
    messages[n],
    3000
  );

}

/* =========================
   ANSWER
========================= */

function pressKey(value){

  if(!playing)return;

  if(
    Number(value)===
    currentAnswer
  ){

    /* 正解 */

    correctCount++;

    combo++;

    /*
      基本10点
      5コンボ以上は少しボーナス
    */

    score+=
      10+
      (
        combo>=5
        ?Math.min(combo,20)
        :0
      );

    /* 静かめSE */

    soundCorrect();

    hitFlash();

    /*
      正解数による演出
    */

    if(
      [
        30,
        50,
        80,
        100
      ].includes(
        correctCount
      )
    ){

      milestone(
        correctCount
      );

    }

  }else{

    /* ミス */

    missCount++;

    combo=0;

    soundMiss();

    hitFlash();

  }

  $("correctText")
    .textContent=
      correctCount;

  $("wrongText")
    .textContent=
      missCount;

  $("scoreText")
    .textContent=
      score;

  updateCombo();

  advanceQuestion();

}

/* =========================
   KEYPAD
========================= */

document
  .querySelectorAll(".key")
  .forEach(button=>{

    button.onclick=()=>
      pressKey(
        button.dataset.key
      );

  });

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      /^[0-9]$/.test(
        e.key
      )
    ){

      pressKey(e.key);

    }

  }
);

/* =========================
   START
========================= */

function startGame(){

  initAudio();

  clearInterval(timer);

  clearTimeout(resultTimer);

  stopFever();

  $("resultOverlay")
    .style.display=
      "none";

  playing=true;

  correctCount=0;
  missCount=0;
  combo=0;
  score=0;

  timeLeft=
    selectedTime;

  $("correctText")
    .textContent="0";

  $("wrongText")
    .textContent="0";

  $("scoreText")
    .textContent="0";

  $("combo")
    .textContent="COMBO 0";

  $("timeText")
    .textContent=
      selectedTime;

  $("timer")
    .style.width=
      "100%";

  $("startButton")
    .textContent=
      "PLAYING...";

  createFirstQuestion();

  timer=
    setInterval(()=>{

      timeLeft-=.1;

      if(
        timeLeft<=0
      ){

        timeLeft=0;

        endGame();

        return;

      }

      $("timeText")
        .textContent=
          timeLeft.toFixed(1);

      $("timer")
        .style.width=
          (
            timeLeft/
            selectedTime*
            100
          )+"%";

    },100);

}

/* =========================
   RESULT PARTICLES
========================= */

function createResultParticles(){

  $("resultBurst")
    .innerHTML="";

  for(
    let i=0;
    i<45;
    i++
  ){

    const p=
      document.createElement(
        "div"
      );

    p.className=
      "rParticle";

    p.style.setProperty(
      "--lx",
      Math.random()*100+"%"
    );

    p.style.setProperty(
      "--ly",
      Math.random()*100+"%"
    );

    p.style.animationDelay=
      Math.random()*.25+"s";

    $("resultBurst")
      .appendChild(p);

  }

}

/* =========================
   END GAME
========================= */

function endGame(){

  clearInterval(timer);

  timer=null;

  playing=false;

  stopFever();

  $("startButton")
    .textContent=
      "START GAME";

  const rate=
    (
      correctCount+
      missCount
    )
    ?
    Math.round(
      correctCount/
      (
        correctCount+
        missCount
      )*
      100
    )
    :
    0;

  /*
    ゲーム終了時のスコアを
    そのままポイントに変換
  */

  const earned=
    score;

  totalPoints+=
    earned;

  savePoints();

  let title=
    "RESULT";

  if(
    bestCombo>=20
  ){

    title=
      "🔥 LEGENDARY!!! 🔥";

  }else if(
    bestCombo>=15
  ){

    title=
      "⚡ AMAZING!! ⚡";

  }else if(
    correctCount>=30
  ){

    title=
      "🌈 GREAT!! 🌈";

  }else if(
    correctCount>=20 &&
    missCount<=5
  ){

    title=
      "✨ NICE PLAY! ✨";

  }else if(
    missCount<=3
  ){

    title=
      "🎯 ACCURATE!";

  }

  $("resultTitle")
    .textContent=
      title;

  $("resultScore")
    .textContent=
      score;

  $("resultCorrect")
    .textContent=
      correctCount;

  $("resultWrong")
    .textContent=
      missCount;

  $("resultCombo")
    .textContent=
      bestCombo;

  $("resultRate")
    .textContent=
      rate+"%";

  $("earnedPoints")
    .textContent=
      earned;

  $("resultOverlay")
    .style.display=
      "flex";

  createResultParticles();

  soundResult();

  /*
    結果画面の粒子演出は
    3秒で完全停止
  */

  resultTimer=
    setTimeout(()=>{

      $("resultBurst")
        .innerHTML="";

    },3000);

}

/* =========================
   RESTART
========================= */

$("restartButton")
  .onclick=()=>{

    startGame();

  };

/* =========================
   TITLE
========================= */

$("titleButton")
  .onclick=()=>{

    clearInterval(timer);

    timer=null;

    clearTimeout(
      resultTimer
    );

    stopFever();

    playing=false;

    $("resultOverlay")
      .style.display=
        "none";

    $("questionA")
      .textContent=
        "READY?";

    $("qOperator")
      .textContent="";

    $("questionB")
      .textContent="";

    $("nextNumber1")
      .textContent="-";

    $("nextNumber2")
      .textContent="-";

    $("correctText")
      .textContent="0";

    $("wrongText")
      .textContent="0";

    $("scoreText")
      .textContent="0";

    $("combo")
      .textContent=
        "COMBO 0";

    $("timeText")
      .textContent=
        selectedTime;

    $("timer")
      .style.width=
        "100%";

    $("startButton")
      .textContent=
        "START GAME";

  };

/* =========================
   INITIALIZE
========================= */

$("bestText")
  .textContent=
    bestCombo;

updatePoints();

</script>
