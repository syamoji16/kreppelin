<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURO KREPELIN</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #18243d 0%, #090d18 45%, #05070d 100%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.game {
  width: min(94vw, 700px);
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(32px, 8vw, 58px);
  letter-spacing: 5px;
  font-weight: 900;
}

.subtitle {
  margin-top: 5px;
  color: #8fa7d8;
  letter-spacing: 2px;
  font-size: 14px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 25px 0;
}

.stat {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px;
  padding: 10px 4px;
}

.label {
  font-size: 10px;
  color: #8d9bb8;
  letter-spacing: 1px;
}

.value {
  margin-top: 3px;
  font-size: 22px;
  font-weight: 800;
}

.problem {
  min-height: 190px;
  border-radius: 25px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 15px 50px rgba(0,0,0,.3);
}

.question {
  font-size: clamp(38px, 11vw, 72px);
  font-weight: 900;
  letter-spacing: 4px;
}

input {
  width: 80%;
  max-width: 400px;
  margin-top: 20px;
  padding: 16px;
  border-radius: 14px;
  border: 2px solid #394b70;
  background: #0a0f1c;
  color: white;
  text-align: center;
  font-size: 30px;
  font-weight: 700;
  outline: none;
}

input:focus {
  border-color: #6d9cff;
  box-shadow: 0 0 20px rgba(80,130,255,.25);
}

button {
  margin-top: 18px;
  width: 80%;
  max-width: 400px;
  padding: 15px;
  border: 0;
  border-radius: 14px;
  background: #426ee8;
  color: white;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.message {
  height: 35px;
  margin-top: 12px;
  font-size: 18px;
  font-weight: 800;
}

.correct {
  color: #65ffb0;
}

.wrong {
  color: #ff667d;
}

.gameover {
  font-size: 28px;
  font-weight: 900;
}

.hidden {
  display: none;
}

@media (max-width: 500px) {
  .stats {
    gap: 4px;
  }

  .stat {
    padding: 8px 2px;
  }

  .value {
    font-size: 18px;
  }

  .problem {
    min-height: 180px;
  }
}
</style>
</head>

<body>

<div class="game">

  <h1>NEURO KREPELIN</h1>
  <div class="subtitle">反射 × 計算 × コンボ</div>

  <div class="stats">
    <div class="stat">
      <div class="label">TIME</div>
      <div class="value" id="time">30.0</div>
    </div>

    <div class="stat">
      <div class="label">正解</div>
      <div class="value" id="correct">0</div>
    </div>

    <div class="stat">
      <div class="label">ミス</div>
      <div class="value" id="wrong">0</div>
    </div>

    <div class="stat">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>

    <div class="stat">
      <div class="label">COMBO</div>
      <div class="value" id="combo">0</div>
    </div>
  </div>

  <div class="problem">

    <div id="question" class="question">START</div>

    <input
      id="answer"
      type="number"
      inputmode="numeric"
      autocomplete="off"
      placeholder="答え"
      disabled
    >

    <button id="startButton">START</button>

    <div id="message" class="message"></div>

  </div>

</div>

<script>
const question = document.getElementById("question");
const answer = document.getElementById("answer");
const startButton = document.getElementById("startButton");

const timeDisplay = document.getElementById("time");
const correctDisplay = document.getElementById("correct");
const wrongDisplay = document.getElementById("wrong");
const bestDisplay = document.getElementById("best");
const comboDisplay = document.getElementById("combo");
const message = document.getElementById("message");

let correct = 0;
let wrong = 0;
let combo = 0;
let best = Number(localStorage.getItem("neuroKrepelinBest") || 0);

let running = false;
let currentAnswer = 0;
let endTime = 0;
let timer = null;

bestDisplay.textContent = best;

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function makeQuestion() {
  const a = randomInt(1, 9);
  const b = randomInt(1, 9);

  currentAnswer = a + b;

  question.textContent = `${a} + ${b}`;
}

function updateStats() {
  correctDisplay.textContent = correct;
  wrongDisplay.textContent = wrong;
  comboDisplay.textContent = combo;
  bestDisplay.textContent = best;
}

function startGame() {
  correct = 0;
  wrong = 0;
  combo = 0;

  running = true;

  answer.disabled = false;
  startButton.classList.add("hidden");

  message.textContent = "";
  message.className = "message";

  endTime = performance.now() + 30000;

  updateStats();
  makeQuestion();

  answer.value = "";
  answer.focus();

  clearInterval(timer);

  timer = setInterval(updateTime, 50);
  updateTime();
}

function updateTime() {
  if (!running) return;

  const remaining = Math.max(0, endTime - performance.now());
  const seconds = remaining / 1000;

  timeDisplay.textContent = seconds.toFixed(1);

  if (remaining <= 0) {
    finishGame();
  }
}

function submitAnswer() {
  if (!running) return;

  const value = Number(answer.value);

  if (answer.value === "") return;

  if (value === currentAnswer) {

    correct++;
    combo++;

    if (combo > best) {
      best = combo;
      localStorage.setItem("neuroKrepelinBest", best);
    }

    message.textContent = "CORRECT!";
    message.className = "message correct";

  } else {

    wrong++;
    combo = 0;

    message.textContent = "MISS!";
    message.className = "message wrong";
  }

  answer.value = "";

  updateStats();
  makeQuestion();
}

function finishGame() {
  running = false;

  clearInterval(timer);

  timeDisplay.textContent = "0.0";

  answer.disabled = true;

  question.textContent = "TIME UP!";
  message.textContent =
    `正解 ${correct}　ミス ${wrong}　BEST COMBO ${best}`;

  message.className = "message";

  startButton.textContent = "もう一度";
  startButton.classList.remove("hidden");
}

answer.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    submitAnswer();
  }
});

answer.addEventListener("input", function() {
  if (!running) return;

  // 数字が入力されたら自動判定
  if (answer.value.length >= String(currentAnswer).length) {
    submitAnswer();
  }
});

startButton.addEventListener("click", startGame);

updateStats();
</script>

</body>
</html>
