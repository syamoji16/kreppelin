<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURO KREPELIN</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 20% 20%, #ff00cc55, transparent 30%),
    radial-gradient(circle at 80% 30%, #00eaff55, transparent 30%),
    radial-gradient(circle at 50% 90%, #7b2cff55, transparent 35%),
    linear-gradient(135deg, #080018, #001b35, #18002b);
  background-size: 200% 200%;
  animation: bgMove 8s ease-in-out infinite alternate;
}

@keyframes bgMove {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 100%; }
}

.game {
  width: min(520px, 94vw);
  padding: 20px 14px 30px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(32px, 9vw, 58px);
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(
    90deg,
    #ff00cc,
    #ffea00,
    #00ff9d,
    #00eaff,
    #7b2cff,
    #ff00cc
  );
  background-size: 300% auto;
  -webkit-background-clip: text;
  color: transparent;
  animation: rainbow 3s linear infinite;
  filter: drop-shadow(0 0 12px #ffffff66);
}

@keyframes rainbow {
  to { background-position: 300% center; }
}

.subtitle {
  margin-top: 4px;
  margin-bottom: 18px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #ddd;
}

.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin-bottom: 18px;
}

.stat {
  padding: 8px 3px;
  border-radius: 12px;
  background: #ffffff12;
  border: 1px solid #ffffff2c;
  box-shadow: 0 0 12px #00eaff22;
}

.stat-label {
  font-size: 10px;
  opacity: .7;
}

.stat-value {
  font-size: 17px;
  font-weight: 900;
  margin-top: 2px;
}

#time {
  color: #00eaff;
}

#correct {
  color: #00ff9d;
}

#miss {
  color: #ff477e;
}

#best {
  color: #ffe600;
}

#combo {
  color: #ff00cc;
}

.time-select {
  margin-bottom: 18px;
}

.time-title {
  font-size: 13px;
  margin-bottom: 8px;
  opacity: .75;
}

.time-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.time-button {
  border: none;
  color: white;
  font-size: 17px;
  font-weight: 900;
  padding: 11px 24px;
  border-radius: 18px;
  background: linear-gradient(135deg, #7b2cff, #ff00cc);
  box-shadow: 0 0 15px #ff00cc55;
}

.time-button:nth-child(2) {
  background: linear-gradient(135deg, #00eaff, #0066ff);
}

.time-button.selected {
  transform: scale(1.08);
  box-shadow:
    0 0 10px white,
    0 0 25px currentColor;
  outline: 3px solid white;
}

.start-button,
.restart-button {
  border: none;
  color: white;
  font-weight: 900;
  font-size: 18px;
  padding: 13px 30px;
  border-radius: 30px;
  background: linear-gradient(
    90deg,
    #ff00cc,
    #7b2cff,
    #00eaff,
    #00ff9d,
    #ffea00,
    #ff00cc
  );
  background-size: 300% 100%;
  animation: rainbowButton 2s linear infinite;
  box-shadow:
    0 0 15px #ff00cc88,
    0 0 35px #00eaff44;
  cursor: pointer;
}

@keyframes rainbowButton {
  to { background-position: 300% 0; }
}

.start-button:active,
.restart-button:active,
.time-button:active,
.key:active {
  transform: scale(.92);
}

.question-box {
  min-height: 145px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.question {
  font-size: clamp(48px, 15vw, 82px);
  font-weight: 900;
  letter-spacing: 4px;
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff,
    0 0 50px #7b2cff;
}

.question-pop {
  animation: questionPop .16s ease-out;
}

@keyframes questionPop {
  0% {
    transform: scale(.55) rotate(-5deg);
    opacity: .2;
  }
  70% {
    transform: scale(1.12) rotate(2deg);
  }
  100% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}

.question.correct {
  animation: correctFlash .28s ease-out;
}

@keyframes correctFlash {
  0% {
    color: #00ff9d;
    transform: scale(1);
    text-shadow: 0 0 10px #00ff9d;
  }
  50% {
    color: white;
    transform: scale(1.25);
    text-shadow:
      0 0 20px #00ff9d,
      0 0 50px #00ff9d;
  }
  100% {
    transform: scale(1);
  }
}

.question.miss {
  animation: missShake .28s ease-out;
}

@keyframes missShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-12px); }
  40% { transform: translateX(12px); }
  60% { transform: translateX(-8px); }
  80% { transform: translateX(8px); }
}

.message {
  min-height: 32px;
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 12px;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 380px;
  margin: auto;
}

.key {
  border: none;
  min-height: 72px;
  border-radius: 20px;
  color: white;
  font-size: 30px;
  font-weight: 900;
  cursor: pointer;
  box-shadow:
    inset 0 -5px 0 #00000033,
    0 7px 15px #00000055;
  transition: transform .08s;
}

.key:nth-child(1) { background: linear-gradient(135deg,#ff3864,#ff00cc); }
.key:nth-child(2) { background: linear-gradient(135deg,#ff7a00,#ff3864); }
.key:nth-child(3) { background: linear-gradient(135deg,#ffe600,#ff7a00); }
.key:nth-child(4) { background: linear-gradient(135deg,#00ff9d,#00c853); }
.key:nth-child(5) { background: linear-gradient(135deg,#00eaff,#008cff); }
.key:nth-child(6) { background: linear-gradient(135deg,#007bff,#7b2cff); }
.key:nth-child(7) { background: linear-gradient(135deg,#7b2cff,#c000ff); }
.key:nth-child(8) { background: linear-gradient(135deg,#ff00cc,#ff3864); }
.key:nth-child(9) { background: linear-gradient(135deg,#ff3864,#ff7a00); }
.key:nth-child(10) {
  grid-column: 2;
  background: linear-gradient(135deg,#333,#111);
}

.combo-pop {
  position: fixed;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  z-index: 100;
  pointer-events: none;
  font-size: clamp(45px, 14vw, 85px);
  font-weight: 900;
  color: #ffe600;
  text-shadow:
    0 0 10px #ff00cc,
    0 0 30px #00eaff,
    0 0 60px #ffe600;
  animation: comboPop 1s ease-out forwards;
}

@keyframes comboPop {
  0% {
    transform: translate(-50%, -50%) scale(.2) rotate(-15deg);
    opacity: 0;
  }
  20% {
    transform: translate(-50%, -50%) scale(1.3) rotate(5deg);
    opacity: 1;
  }
  45% {
    transform: translate(-50%, -50%) scale(1) rotate(-2deg);
  }
  100% {
    transform: translate(-50%, -50%) scale(1.7) rotate(0);
    opacity: 0;
  }
}

.combo-fire {
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  background: radial-gradient(circle, #ff00cc55, transparent 55%);
  animation: fireFlash .5s ease-out forwards;
}

@keyframes fireFlash {
  0% { opacity: 0; }
  30% { opacity: 1; }
  100% { opacity: 0; }
}

.combo-flash {
  position: fixed;
  inset: 0;
  z-index: 80;
  pointer-events: none;
  border: 8px solid #ffe600;
  animation: flashBorder .5s ease-out forwards;
}

@keyframes flashBorder {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* 結果画面 */

.result-boom {
  animation: resultBoom 1.1s cubic-bezier(.2,.8,.2,1);
}

@keyframes resultBoom {
  0% { transform: scale(1) rotate(0deg); }
  8% { transform: scale(1.08) rotate(-1.5deg); }
  16% { transform: scale(.94) rotate(1.8deg); }
  25% { transform: scale(1.12) rotate(-1.2deg); }
  35% { transform: scale(.97) rotate(1deg); }
  48% { transform: scale(1.06) rotate(-.6deg); }
  65% { transform: scale(1.01) rotate(.3deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.result-color-flash {
  position: fixed;
  inset: 0;
  z-index: 150;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: screen;
}

.result-color-flash.active {
  animation: colorFlash .9s steps(1, end);
}

@keyframes colorFlash {
  0% { opacity: 0; background:#ff00cc; }
  8% { opacity:.75; background:#ff00cc; }
  16% { opacity:0; }
  24% { opacity:.8; background:#00eaff; }
  32% { opacity:0; }
  40% { opacity:.8; background:#ffe600; }
  48% { opacity:0; }
  56% { opacity:.8; background:#7b2cff; }
  64% { opacity:0; }
  72% { opacity:.8; background:#00ff9d; }
  80% { opacity:0; }
  88% { opacity:.9; background:#ff3864; }
  100% { opacity:0; }
}

.result-restart {
  margin-top: 15px;
}

/* スマホ */

@media (max-width: 420px) {
  .game {
    padding-top: 12px;
  }

  .stats {
    gap: 3px;
  }

  .stat {
    padding: 7px 2px;
  }

  .stat-value {
    font-size: 15px;
  }

  .key {
    min-height: 65px;
    font-size: 27px;
  }

  .question-box {
    min-height: 125px;
  }
}
</style>
</head>

<body>

<div class="game">

  <h1>NEURO KREPELIN</h1>
  <div class="subtitle">反射 × 計算 × コンボ</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">30.0</div>
    </div>

    <div class="stat">
      <div class="stat-label">正解</div>
      <div class="stat-value" id="correct">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">ミス</div>
      <div class="stat-value" id="miss">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">COMBO</div>
      <div class="stat-value" id="combo">0</div>
    </div>
  </div>

  <div class="time-select" id="timeSelect">

    <div class="time-title">PLAY TIME</div>

    <div class="time-buttons">
      <button class="time-button selected" data-time="30">
        30 SEC
      </button>

      <button class="time-button" data-time="60">
        60 SEC
      </button>
    </div>

  </div>

  <button class="start-button" id="startButton">
    START GAME
  </button>

  <div class="question-box">

    <div class="question" id="question">
      READY?
    </div>

    <div class="message" id="message"></div>

  </div>

  <div class="keypad">

    <button class="key" data-number="1">1</button>
    <button class="key" data-number="2">2</button>
    <button class="key" data-number="3">3</button>

    <button class="key" data-number="4">4</button>
    <button class="key" data-number="5">5</button>
    <button class="key" data-number="6">6</button>

    <button class="key" data-number="7">7</button>
    <button class="key" data-number="8">8</button>
    <button class="key" data-number="9">9</button>

    <button class="key zero" data-number="0">0</button>

  </div>

  <div class="result-restart" id="resultRestart" style="display:none;">
    <button class="restart-button" id="restartButton">
      🔄 やり直す
    </button>
  </div>

</div>

<script>

let selectedTime = 30;

let gameRunning = false;
let endTime = 0;
let timerInterval = null;

let correct = 0;
let miss = 0;
let combo = 0;

let currentAnswer = 0;

let best = Number(
  localStorage.getItem("neuroKreppelinBest") || 0
);

let nextNumber = null;

const timeEl = document.getElementById("time");
const correctEl = document.getElementById("correct");
const missEl = document.getElementById("miss");
const bestEl = document.getElementById("best");
const comboEl = document.getElementById("combo");

const questionEl = document.getElementById("question");
const messageEl = document.getElementById("message");

const timeSelect = document.getElementById("timeSelect");
const startButton = document.getElementById("startButton");

const resultRestart =
  document.getElementById("resultRestart");

const restartButton =
  document.getElementById("restartButton");


/* -------------------------
   ランダム
------------------------- */

function randomInt(min, max) {
  return Math.floor(
    Math.random() * (max - min + 1)
  ) + min;
}


/* -------------------------
   問題生成
------------------------- */

function makeQuestion() {

  let a;

  /*
    最初だけランダム。

    2〜9だけを使用するので
    1は絶対に出ない。
  */

  if (nextNumber === null) {
    a = randomInt(2, 9);
  } else {
    /*
      前の問題の右側を
      次の問題の左側にする
    */
    a = nextNumber;
  }

  const b = randomInt(2, 9);

  /*
    次の問題の左側へ引き継ぐ
  */
  nextNumber = b;

  /*
    答えは1の位だけ
  */
  currentAnswer = (a + b) % 10;

  questionEl.textContent =
    `${a} + ${b}`;

  questionEl.classList.remove("question-pop");

  void questionEl.offsetWidth;

  questionEl.classList.add("question-pop");
}


/* -------------------------
   スタート
------------------------- */

function startGame() {

  gameRunning = true;

  correct = 0;
  miss = 0;
  combo = 0;

  /*
    新しいゲームでは
    問題の連鎖もリセット
  */
  nextNumber = null;

  updateStats();

  timeSelect.style.display = "none";

  startButton.style.display = "none";

  resultRestart.style.display = "none";

  messageEl.textContent = "";
  messageEl.style.color = "";

  questionEl.style.color = "";
  questionEl.style.textShadow = "";

  endTime =
    performance.now() +
    selectedTime * 1000;

  makeQuestion();

  clearInterval(timerInterval);

  timerInterval =
    setInterval(updateTime, 40);
}


/* -------------------------
   時間更新
------------------------- */

function updateTime() {

  if (!gameRunning) return;

  const remaining =
    Math.max(
      0,
      endTime - performance.now()
    );

  timeEl.textContent =
    (remaining / 1000).toFixed(1);

  if (remaining <= 0) {
    finishGame();
  }
}


/* -------------------------
   ステータス
------------------------- */

function updateStats() {

  correctEl.textContent = correct;
  missEl.textContent = miss;
  bestEl.textContent = best;
  comboEl.textContent = combo;
}


/* -------------------------
   数字を押す
------------------------- */

function answerQuestion(number) {

  if (!gameRunning) return;

  if (number === currentAnswer) {

    correct++;
    combo++;

    /*
      BEST COMBO更新
    */
    if (combo > best) {

      best = combo;

      localStorage.setItem(
        "neuroKreppelinBest",
        best
      );
    }

    messageEl.textContent = "NICE!";
    messageEl.style.color = "#00ff9d";

    questionEl.classList.remove("correct");

    void questionEl.offsetWidth;

    questionEl.classList.add("correct");

    comboEffect();

  } else {

    miss++;
    combo = 0;

    messageEl.textContent = "MISS!";
    messageEl.style.color = "#ff477e";

    questionEl.classList.remove("miss");

    void questionEl.offsetWidth;

    questionEl.classList.add("miss");

    if (navigator.vibrate) {
      navigator.vibrate(30);
    }
  }

  updateStats();

  /*
    即座に次の問題へ
  */
  makeQuestion();
}


/* -------------------------
   コンボ演出
------------------------- */

function comboEffect() {

  /*
    5コンボごとに派手な演出
  */
  if (
    combo < 5 ||
    combo % 5 !== 0
  ) {
    return;
  }

  const pop =
    document.createElement("div");

  pop.className = "combo-pop";

  pop.textContent =
    `${combo} COMBO!`;

  document.body.appendChild(pop);

  setTimeout(() => {
    pop.remove();
  }, 1000);


  const fire =
    document.createElement("div");

  fire.className = "combo-fire";

  document.body.appendChild(fire);

  setTimeout(() => {
    fire.remove();
  }, 500);


  const flash =
    document.createElement("div");

  flash.className = "combo-flash";

  document.body.appendChild(flash);

  setTimeout(() => {
    flash.remove();
  }, 500);


  if (navigator.vibrate) {

    navigator.vibrate([
      40,
      30,
      70,
      30,
      100
    ]);
  }
}


/* -------------------------
   ゲーム終了
------------------------- */

function finishGame() {

  gameRunning = false;

  clearInterval(timerInterval);

  timeEl.textContent = "0.0";

  timeSelect.style.display = "block";

  startButton.style.display = "block";

  startButton.textContent =
    "PLAY AGAIN";

  /*
    やり直しボタンを表示
  */
  resultRestart.style.display = "block";


  let title = "";
  let color = "";
  let effect = "";


  if (best >= 20) {

    title = "🔥 LEGENDARY!!! 🔥";
    color = "#ff00cc";
    effect = "legend";

  } else if (best >= 15) {

    title = "⚡ AMAZING!! ⚡";
    color = "#00eaff";
    effect = "amazing";

  } else if (correct >= 30) {

    title = "🌈 GREAT!! 🌈";
    color = "#ffe600";
    effect = "great";

  } else if (
    correct >= 20 &&
    miss <= 5
  ) {

    title = "✨ NICE PLAY! ✨";
    color = "#00ff9d";
    effect = "nice";

  } else if (miss <= 3) {

    title = "🎯 ACCURATE!";
    color = "#7b7cff";
    effect = "accurate";

  } else {

    title = "RESULT";
    color = "#ffffff";
    effect = "normal";
  }


  questionEl.textContent = title;

  questionEl.style.color = color;

  questionEl.style.textShadow =
    `0 0 10px ${color},
     0 0 25px ${color},
     0 0 50px ${color}`;


  messageEl.innerHTML =
    `正解 <strong>${correct}</strong>　
     ミス <strong>${miss}</strong><br>
     BEST COMBO <strong>${best}</strong>`;

  messageEl.style.color = color;


  resultExplosion(color);
}


/* -------------------------
   結果演出
------------------------- */

function resultExplosion(color) {

  /*
    画面全体ブォンブォン
  */
  document.body.classList.remove(
    "result-boom"
  );

  void document.body.offsetWidth;

  document.body.classList.add(
    "result-boom"
  );


  /*
    全画面カラー点滅
  */
  const colorFlash =
    document.createElement("div");

  colorFlash.className =
    "result-color-flash";

  document.body.appendChild(colorFlash);

  void colorFlash.offsetWidth;

  colorFlash.classList.add("active");

  setTimeout(() => {
    colorFlash.remove();
  }, 1000);


  /*
    大量のパーティクル
  */
  const symbols = [
    "★",
    "✦",
    "◆",
    "●"
  ];

  for (let i = 0; i < 35; i++) {

    const particle =
      document.createElement("div");

    particle.textContent =
      symbols[
        randomInt(0, symbols.length - 1)
      ];

    particle.style.position = "fixed";

    particle.style.left = "50%";
    particle.style.top = "50%";

    particle.style.zIndex = "200";

    particle.style.pointerEvents =
      "none";

    particle.style.color = color;

    particle.style.fontSize =
      randomInt(15, 35) + "px";

    particle.style.textShadow =
      `0 0 10px ${color},
       0 0 25px ${color}`;

    document.body.appendChild(
      particle
    );


    const angle =
      Math.random() *
      Math.PI * 2;

    const distance =
      randomInt(180, 500);

    const x =
      Math.cos(angle) *
      distance;

    const y =
      Math.sin(angle) *
      distance;


    particle.animate(
      [
        {
          transform:
            "translate(-50%, -50%) scale(.2)",
          opacity: 1
        },
        {
          transform:
            `translate(
              calc(-50% + ${x}px),
              calc(-50% + ${y}px)
            )
            rotate(${randomInt(-720,720)}deg)
            scale(1.5)`,
          opacity: 0
        }
      ],
      {
        duration:
          randomInt(700, 1200),

        easing:
          "cubic-bezier(.1,.8,.2,1)",

        fill: "forwards"
      }
    );

    setTimeout(() => {
      particle.remove();
    }, 1300);
  }


  if (navigator.vibrate) {

    navigator.vibrate([
      80,
      40,
      120,
      40,
      180
    ]);
  }
}


/* -------------------------
   時間選択
------------------------- */

document
  .querySelectorAll(".time-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        if (gameRunning) return;

        selectedTime =
          Number(button.dataset.time);

        document
          .querySelectorAll(".time-button")
          .forEach(b => {
            b.classList.remove(
              "selected"
            );
          });

        button.classList.add(
          "selected"
        );

        timeEl.textContent =
          selectedTime.toFixed(1);
      }
    );
  });


/* -------------------------
   スタートボタン
------------------------- */

startButton.addEventListener(
  "click",
  startGame
);


/* -------------------------
   やり直しボタン
------------------------- */

restartButton.addEventListener(
  "click",
  () => {

    /*
      現在選択されている
      30秒 / 60秒のまま
      もう一度スタート
    */
    startGame();
  }
);


/* -------------------------
   数字ボタン
------------------------- */

document
  .querySelectorAll(".key")
  .forEach(button => {

    button.addEventListener(
      "click",
